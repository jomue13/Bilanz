/* ---------- v14: Barcode-Scanner ---------- */
.sheet.scan{z-index:27;background:#05080B;color:#fff;color-scheme:dark}
.sc{max-width:560px;margin:0 auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.sc-top{display:flex;align-items:center;justify-content:space-between;font-size:17px;min-height:48px}
.sc-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;line-height:1}
.sc-cam{position:relative;border-radius:22px;overflow:hidden;background:#111;aspect-ratio:3/4;max-height:56vh;width:100%}
.sc-cam video{width:100%;height:100%;object-fit:cover;display:block}
.sc-frame{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.sc-frame i{width:82%;height:30%;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.38);border:2px solid rgba(255,255,255,.92);position:relative;overflow:hidden}
.sc-frame i::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF5A4F;box-shadow:0 0 12px #FF5A4F;animation:scLine 1.6s ease-in-out infinite}
@keyframes scLine{0%,100%{transform:translateY(-30px)}50%{transform:translateY(30px)}}
.sc-msg{margin:0;text-align:center;font-size:15px;opacity:.92;min-height:22px}
.sc-man{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sc-man input{min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:#fff;padding:0 12px;font-size:16px;font-variant-numeric:tabular-nums}
.sc .btn{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.sc .btn.primary{background:#fff;color:#05080B}
.sc-note{margin:0;font-size:12px;opacity:.6;text-align:center}
.pk-qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.pk-qrow #pick-q{margin:0;width:100%}
.pk-scan{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:0 12px;font-weight:600;font-size:14px;min-height:46px}
.pk-scan svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}

/* ---------- v15: Farbthemen ---------- */
:root{--d-badge:#9C6A0B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d-badge:#B9850F}}
:root[data-theme="dark"]{--d-badge:#B9850F}
:root.oled{--bg:#000;--surface:#0C0E10;--surface2:#15181B;--line:#22272C;--hero-bg:#0C0E10}
:root.oled .tabs{background:color-mix(in srgb,#000 88%,transparent)}
.th-seg button{flex:1}
.th-sw{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.th-c{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 0;border-radius:12px;color:var(--ink);font-size:12px;font-weight:600}
.th-c i{width:34px;height:34px;border-radius:50%;background:var(--sw);box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.th-c.on i{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--sw)}
.th-c.on{background:var(--surface2)}
/* ---------- v15: Live-Leiste ---------- */
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:6;display:flex;gap:8px;justify-content:center;max-width:560px;margin:0 auto 6px;padding:0 16px;pointer-events:none}
.live[hidden]{display:none}
.lv-i{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:46px;padding:6px 14px 6px 8px;border-radius:999px;border:0;background:#0B0F13;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.22);max-width:100%;animation:lvIn .45s cubic-bezier(.2,1.3,.4,1) both;flex:0 1 auto;min-width:0}
.live.two .lv-i{flex:1 1 0}
.lv-ic{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:#2B5BC6}
.lv-wk .lv-ic{background:#3F48B0}
:root[data-theme="dark"] .lv-i{background:#1D252D;box-shadow:0 6px 20px rgba(0,0,0,.5)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .lv-i{background:#1D252D}}
.lv-ic svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lv-t{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1;min-width:0}
.lv-t b{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px;opacity:.85}
.lv-t span{font:700 17px/1.1 var(--font-c);font-variant-numeric:tabular-nums}
.lv-rest{display:flex;align-items:center;gap:5px;margin-left:auto;padding-left:6px;font:700 15px var(--font-c);color:#9CC0FF;font-variant-numeric:tabular-nums}
.lv-rest svg{width:20px;height:20px;transform:rotate(-90deg)}
.lv-rest circle{fill:none;stroke-width:3}.lv-rest .tr{stroke:rgba(255,255,255,.2)}.lv-rest .pr{stroke:#7AA4FF;stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.lv-m{margin-left:auto;padding-left:6px;font:700 16px var(--font-c);color:#B8BEFF;font-variant-numeric:tabular-nums;white-space:nowrap}
@keyframes lvIn{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
/* ---------- v15: Startseite anpassen ---------- */
.home-edit-btn{display:block;margin:6px auto 0;background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;padding:10px 14px;text-decoration:underline;text-underline-offset:3px}
.he-list{list-style:none;margin:12px 0;padding:0;display:flex;flex-direction:column;gap:6px}
.he{display:grid;grid-template-columns:28px minmax(0,1fr) 36px 36px 52px;align-items:center;gap:6px;padding:8px 10px 8px 6px;border-radius:14px;background:var(--surface2);transition:box-shadow .15s,transform .15s}
.he.off .he-n{color:var(--muted);text-decoration:line-through}
.he.drag{box-shadow:0 10px 26px rgba(0,0,0,.2);transform:scale(1.02);background:var(--surface);z-index:2;position:relative}
.he-grip{display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;height:36px;touch-action:none;cursor:grab}
.he-grip i{width:16px;height:2px;border-radius:1px;background:var(--muted)}
.he-n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.he-b{width:36px;height:36px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);font-size:17px}
.he-b:disabled{opacity:.3}
.sw{width:50px;height:30px;border-radius:15px;border:0;background:var(--line);position:relative;padding:0;transition:background .2s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw.on{background:var(--good)}.sw.on i{transform:translateX(20px)}
/* ---------- v15: Tagesringe ---------- */
.rings{display:grid;grid-template-columns:118px minmax(0,1fr);gap:16px;align-items:center;background:var(--surface);border-radius:22px;padding:14px 16px;margin:0 0 12px;cursor:pointer}
.rg{width:118px;height:118px;transform:rotate(-90deg)}
.rg circle{fill:none;stroke-width:9.5;stroke-linecap:round}
.rg .rg-bg{opacity:.16}
.rg .rg-fg.anim{animation:rgIn 1.1s cubic-bezier(.2,.8,.2,1) both}
.rg .rg-fg:nth-of-type(4).anim{animation-delay:.12s}.rg .rg-fg:nth-of-type(6).anim{animation-delay:.24s}
@keyframes rgIn{from{stroke-dashoffset:var(--c0)}}
.rg-l{display:flex;flex-direction:column;gap:7px;min-width:0}
.rg-row{display:grid;grid-template-columns:10px minmax(0,1fr) auto 18px;align-items:center;gap:8px;font-size:14px}
.rg-row i{width:10px;height:10px;border-radius:50%}
.rg-row span{color:var(--muted);font-weight:600}
.rg-row b{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
.rg-row b small{color:var(--muted);font-weight:500;font-size:12.5px}
.rg-row em svg{width:16px;height:16px;fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.rg-tr{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:7px}
.rg-tr b{color:var(--ink)}
.rg-tr svg{width:16px;height:16px;fill:none;stroke:var(--good);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:360px){.rings{grid-template-columns:96px minmax(0,1fr);gap:12px}.rg{width:96px;height:96px}}
/* ---------- v15: Himmel mit Wetter ---------- */
.sky>*:not(.sky-fx){position:relative;z-index:1}
.sky-fx{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden;border-radius:inherit}
.fx-stars i{position:absolute;width:var(--s);height:var(--s);border-radius:50%;background:#fff;opacity:.8;animation:twinkle var(--d) ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.2}to{opacity:.95}}
.fx-glow{position:absolute;right:-60px;top:-70px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(255,236,170,.55),rgba(255,236,170,0) 65%);animation:glow 6s ease-in-out infinite alternate}
@keyframes glow{to{transform:scale(1.12);opacity:.8}}
.fx-clouds i{position:absolute;height:44px;border-radius:999px;background:rgba(255,255,255,.22);filter:blur(6px);animation:drift 46s linear infinite}
.fx-clouds i::before{content:"";position:absolute;left:22%;top:-18px;width:46%;height:46px;border-radius:50%;background:inherit}
.fx-clouds i:nth-child(1){width:170px;top:26px;left:-40px}
.fx-clouds i:nth-child(2){width:130px;top:92px;left:40%;animation-duration:62s;animation-delay:-20s;opacity:.8}
.fx-clouds i:nth-child(3){width:200px;top:160px;left:10%;animation-duration:75s;animation-delay:-40s;opacity:.6}
.fx-clouds.thick i{background:rgba(220,228,236,.34)}
@keyframes drift{from{transform:translateX(-30%)}to{transform:translateX(130%)}}
.fx-rain{position:absolute;inset:-40px 0 0;background-image:repeating-linear-gradient(105deg,rgba(255,255,255,0) 0 14px,rgba(255,255,255,.28) 14px 15px,rgba(255,255,255,0) 15px 34px);background-size:120px 120px;animation:rain .55s linear infinite;opacity:.8}
@keyframes rain{to{background-position:-30px 120px}}
.fx-snow{position:absolute;inset:-60px 0 0;background-image:radial-gradient(circle,rgba(255,255,255,.9) 1.4px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.6) 1px,transparent 1.6px);background-size:60px 60px,38px 38px;animation:snow 6s linear infinite}
@keyframes snow{to{background-position:20px 60px,-12px 38px}}
.fx-flash{position:absolute;inset:0;background:#fff;opacity:0;animation:flash 9s infinite}
@keyframes flash{0%,92%,96%,100%{opacity:0}93%{opacity:.35}95%{opacity:.15}}
.sky-fx.still *{animation:none!important}
/* ---------- v15: Übergänge ---------- */
#main{view-transition-name:main}
::view-transition-old(root),::view-transition-new(root){animation:none}
::view-transition-old(main),::view-transition-new(main){animation-duration:.3s;animation-timing-function:cubic-bezier(.2,.8,.2,1)}
html[data-vt="left"]::view-transition-old(main){animation-name:vtOutL}
html[data-vt="left"]::view-transition-new(main){animation-name:vtInR}
html[data-vt="right"]::view-transition-old(main){animation-name:vtOutR}
html[data-vt="right"]::view-transition-new(main){animation-name:vtInL}
html[data-vt="push"]::view-transition-old(main){animation-name:vtFadeOut}
html[data-vt="push"]::view-transition-new(main){animation-name:vtInR}
html[data-vt="pop"]::view-transition-old(main){animation-name:vtOutR}
html[data-vt="pop"]::view-transition-new(main){animation-name:vtFadeIn}
::view-transition-group(morph){animation-duration:.42s;animation-timing-function:cubic-bezier(.2,.9,.2,1)}
@keyframes vtOutL{to{transform:translateX(-22%);opacity:0}}
@keyframes vtOutR{to{transform:translateX(22%);opacity:0}}
@keyframes vtInR{from{transform:translateX(22%);opacity:0}}
@keyframes vtInL{from{transform:translateX(-22%);opacity:0}}
@keyframes vtFadeOut{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0}}
/* Wischen in Listen */
.swipe-li{position:relative;--sx:0px}
.swipe-li>*{transform:translateX(var(--sx));transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.swipe-li.swiping>*{transition:none}
.swipe-li.sw-r::before,.swipe-li.sw-l::before{content:"";position:absolute;inset:2px 0;border-radius:12px;z-index:-1}
.swipe-li.sw-r::before{background:color-mix(in srgb,var(--good) 22%,transparent)}
.swipe-li.sw-l::before{background:color-mix(in srgb,var(--warn) 22%,transparent)}
.swipe-li.arm.sw-r::before{background:color-mix(in srgb,var(--good) 45%,transparent)}
.swipe-li.arm.sw-l::before{background:color-mix(in srgb,var(--warn) 45%,transparent)}
/* ---------- v15: Level und Abzeichen ---------- */
.lvl{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 14px;align-items:center;background:var(--surface);border-radius:22px;padding:14px 16px;margin:0 0 12px;cursor:pointer}
.lvl-n{width:62px;height:62px;border-radius:18px;background:linear-gradient(150deg,#F5C542,#B7841A);color:#2A1A00;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}

.lvl-n b{font:700 28px/1 var(--font-c)}
.lvl-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lvl-h b{font-size:16px}.lvl-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl-bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden;margin:6px 0 5px}
.lvl-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#F5C542,#E0902A)}
.lvl-bar.on-hero{background:rgba(255,255,255,.22)}
.lvl-bar.on-hero i{background:#fff}
.lvl-s{font-size:12.5px;color:var(--muted)}
.lvl-md{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.lvl-md:empty{display:none}
.lvl-first{grid-column:1/-1;margin:6px 0 0;font-size:13px;color:var(--d-badge);font-weight:600}
.md{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;position:relative;background:var(--surface2);color:var(--muted)}
.md svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;position:relative}
.md.t1,.md.t2,.md.t3,.md.t4{color:#fff;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 2px 6px rgba(0,0,0,.15)}
.md.t1{background:linear-gradient(150deg,#D89A5F,#8A4F22)}
.md.t2{background:linear-gradient(150deg,#E3E9EE,#8794A2);color:#26313C}
.md.t3{background:linear-gradient(150deg,#F7D35C,#B7841A);color:#3A2600}
.md.t4{background:linear-gradient(150deg,#C9EEFA,#5C8FB0);color:#0F2A3A}
.md.t1::after,.md.t2::after,.md.t3::after,.md.t4::after{content:"";position:absolute;inset:0;border-radius:50%;background:linear-gradient(115deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.45) 45%,rgba(255,255,255,0) 60%);background-size:250% 100%;animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,60%{background-position:120% 0}100%{background-position:-120% 0}}
.md.big{width:112px;height:112px}
.md.big svg{width:58px;height:58px;stroke-width:1.6}
.bd-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:8px}
.bd{background:var(--surface);border-radius:18px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.bd .md{width:52px;height:52px}.bd .md svg{width:26px;height:26px}
.bd:not(.on) .md{opacity:.55}
.bd b{font-size:13px;line-height:1.2;margin-top:4px}
.bd small{font-size:11.5px;color:var(--muted);line-height:1.25}
.bd-t{font-size:11px;font-weight:700;margin-top:2px}
.bd-t.t1{color:#A0622E}.bd-t.t2{color:var(--muted)}.bd-t.t3{color:#B7841A}.bd-t.t4{color:#3E7FA6}
.bd-p{width:80%;height:5px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bd-p i{display:block;height:100%;background:var(--d-badge)}
.bd-pn{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvl-hero .big{font-size:48px}
.bdg{position:fixed;inset:0;z-index:38;background:rgba(5,8,11,.62);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px}
.bdg[hidden]{display:none}
.bdg-in{background:var(--surface);border-radius:28px;padding:26px 22px 18px;max-width:340px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;animation:bdgIn .55s cubic-bezier(.2,1.3,.4,1) both}
.bdg-in .md.big{animation:bdgMd .9s cubic-bezier(.2,1.4,.4,1) .1s both;margin:6px 0 8px}
.bdg-k{margin:0;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--d-badge)}
.bdg-in h2{margin:0;font:700 26px/1.1 var(--font-c)}
.bdg-in p{margin:0;color:var(--muted)}
.bdg-in .btn{margin-top:12px}
@keyframes bdgIn{from{transform:scale(.85);opacity:0}}
@keyframes bdgMd{from{transform:scale(.2) rotate(-40deg);opacity:0}}
@media (prefers-reduced-motion: reduce){.md::after{animation:none!important}}
</style>

function vProgress() {
  const list = exerciseStats(); if (!list.length) return '';
  let sel = S.ui.progEx;
  if (!sel || !list.some(x => exKey(x.name) === exKey(sel))) sel = list[0].name;
  const entries = [];
  for (const w of allWorkouts().reverse()) for (const e of w.ex || []) {
    if (exKey(e.name) !== exKey(sel)) continue;
    const sets = (e.sets || []).filter(s => hasVal(s) && !s.warm);
    if (sets.length) entries.push({ date: w.date, sets });
  }
  const allSets = entries.flatMap(x => x.sets), kind = kindOf(allSets), weighted = allSets.some(s => s.kg > 0 && s.reps > 0);
  const pts = []; let best = null;
  for (const x of entries) {
    let v = 0, top = null;
    if (kind === 'cardio') v = x.sets.reduce((a, s) => a + (s.km || 0), 0);
    else if (kind === 'time') v = Math.max(0, ...x.sets.map(s => s.sec || 0));
    else if (weighted) { for (const s of x.sets) { if (!(s.kg > 0) || !(s.reps > 0)) continue; const r = s.kg * (1 + s.reps / 30); if (r > v) { v = r; top = s; } } }
    else v = Math.max(0, ...x.sets.map(s => s.reps || 0));
    if (v > 0) { pts.push({ t: parseKey(x.date).getTime(), v: Math.round(v * 10) / 10 }); if (!best || v > best.v) best = { v, s: top, date: x.date }; }
  }
  let note = '';
  if (best) note = kind === 'cardio' ? `Linie: Strecke pro Training in km. Am weitesten: ${fmt(best.v, 1)} km ${relDay(best.date)}.`
    : kind === 'time' ? `Linie: längster Satz pro Training in Sekunden. Bestwert: ${durTxt(best.v)} ${relDay(best.date)}.`
    : weighted ? `Linie: geschätztes 1RM nach Epley. Bester Satz: ${fmt(best.s.kg, 2)} kg × ${fmt(best.s.reps)} ${relDay(best.date)}.`
    : `Linie: meiste Wiederholungen in einem Satz. Bestwert: ${fmt(best.v)} ${relDay(best.date)}.`;
  const label = kind === 'cardio' ? 'Strecke' : kind === 'time' ? 'Längster Satz' : weighted ? 'Geschätztes Maximalgewicht' : 'Meiste Wiederholungen';
  return `<section class="panel"><div class="panel-h"><h2>Fortschritt</h2><select data-change="prog-ex" aria-label="Übung wählen">${list.map(x => `<option ${exKey(x.name) === exKey(sel) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>
    ${chartSVG(pts, { dots: pts.length <= 40, minSpan: kind === 'cardio' ? 1 : kind === 'time' ? 10 : weighted ? 5 : 2, label, empty: 'Ab zwei Trainings mit dieser Übung siehst du hier deine Entwicklung.' })}
    ${note ? `<p class="small muted">${note.replace(/\.\.$/, '.')}</p>` : ''}</section>`;
}
function vHistory() {
  const ws = allWorkouts();

  const n = S.ui.histN, tk = todayKey(), prSet = new Set(prEvents().ev.map(e => e.date + '|' + exKey(e.name)));
  return `<section class="panel"><h2>Verlauf</h2><ul class="hist">${ws.slice(0, n).map(w => {
    const open = S.ui.openW === w.id;

    const vol = sets.reduce((b, s) => b + (s.kg || 0) * (s.reps || 0), 0), km = sets.reduce((b, s) => b + (s.km || 0), 0);
    const dur = w.end && w.start ? Math.round((w.end - w.start) / 60000) : null, nEx = (w.ex || []).length;
    const sub = [w.loc === 'gym' ? 'Gym' : w.loc === 'zuhause' ? 'Zuhause' : '', `${nEx} ${nEx === 1 ? 'Übung' : 'Übungen'}`, dur ? `${dur} min` : ''].filter(Boolean).join(', ');

      <span class="hist-name">${esc(w.name)}${(w.ex || []).some(e => prSet.has(w.date + '|' + exKey(e.name))) ? '<span class="badge">Rekord</span>' : ''}<small>${sub}</small></span>
      <span class="hist-vol">${vol ? `${fmt(vol)} kg<small>Volumen</small>` : km ? `${fmt(km, 1)} km<small>Strecke</small>` : ''}</span></button>
      ${open ? `<div class="hist-detail">${(w.ex || []).map(e => `<p><b>${esc(e.name)}</b>${prSet.has(w.date + '|' + exKey(e.name)) ? '<span class="badge">Rekord</span>' : ''}: ${(e.sets || []).map(fmtSet).join(', ')}</p>`).join('')}
        <div class="row-actions">${!S.profile.active ? `<button class="btn small" data-a="w-repeat:${w.date}:${w.id}">Wiederholen</button>` : ''}<button class="btn small ghost danger" data-a="w-del:${w.date}:${w.id}" data-confirm="Wirklich löschen?">Löschen</button></div></div>` : ''}</li>`;
  }).join('')}</ul>${ws.length > n ? `<button class="btn ghost wide" data-a="hist-more">Ältere anzeigen</button>` : ''}</section>`;
}

async function importFiles(files) {

  say('Lese Dateien …');
  let W = [], B = [], unknown = 0;
  for (const f of files) {
    let text = null; try { text = await f.text(); } catch (e) { }
    const p = text != null ? hevyParse(text) : null;

async function estimate() {
  const f = S.ui.mealForm, desc = f.desc.trim(), photo = S.ui.photo;
  if (!desc && !photo) { toast('Beschreib zuerst, was du gegessen hast.'); $('#meal-desc')?.focus(); return; }
  if (!AI.sample || S.ui.aiBusy) return;
  S.ui.aiBusy = true; S.ui.aiNote = 'Schätze Nährwerte …'; if (S.ui.pick) renderPickBody(); requestRender();
  const prompt = `Du bist ein sorgfältiger Ernährungsrechner. Schätze die Nährwerte der folgenden Mahlzeit so realistisch wie möglich. Wenn Mengen fehlen, nimm übliche Portionsgrößen in Deutschland an.${photo ? ' Das Foto zeigt die Mahlzeit; schätze die Mengen anhand des Fotos.' : ''}
Antworte nur mit JSON in genau dieser Form:
{"name":"kurzer deutscher Name der Mahlzeit, höchstens 40 Zeichen","kcal":0,"protein":0,"carbs":0,"fat":0,"note":"ein kurzer Satz zu deinen Mengenannahmen"}
kcal in Kilokalorien, protein, carbs und fat in Gramm, jeweils ganze Zahlen.

Mahlzeit: ${desc || '(siehe Foto)'}`;

function csvCell(v) {
  if (v == null) return '';
  let s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
  if (/[;"\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
async function exportCSV(kind) {
  const keys = Object.keys(S.days).sort(); let rows, name;
  if (kind === 'essen') {
    name = 'Ernaehrung'; rows = [['Datum', 'Bereich', 'Mahlzeit', 'Menge', 'kcal', 'Eiweiß (g)', 'Kohlenhydrate (g)', 'Fett (g)']];
    for (const k of keys) for (const m of S.days[k].meals) rows.push([deDate(k), slotName(slotOf(m)), m.name, m.g ? `${m.g} ${m.unit || 'g'}` : '', m.kcal, m.p, m.c, m.f]);
  } else if (kind === 'training') {
    name = 'Training'; rows = [['Datum', 'Training', 'Ort', 'Übung', 'Satz', 'kg', 'Wiederholungen', 'Sekunden', 'km']];
    for (const k of keys) for (const w of S.days[k].workouts) for (const e of w.ex || []) (e.sets || []).forEach((s, i) => rows.push([deDate(k), w.name, w.loc === 'gym' ? 'Gym' : w.loc === 'zuhause' ? 'Zuhause' : '', e.name, i + 1, s.kg, s.reps, s.sec, s.km]));
  } else if (kind === 'alkohol') {
    name = 'Alkohol'; rows = [['Datum', 'Uhrzeit', 'Getränk', 'ml', '% vol', 'g Alkohol', 'kcal']];
    for (const k of keys) for (const d of S.days[k].drinks) rows.push([deDate(k), d.t ? hm(new Date(d.t)) : '', d.name, d.ml, d.abv, r1(alcG(d)), d.kcal]);
  } else {
    name = 'Koerper'; rows = [['Datum', 'Gewicht (kg)', 'KFA (%)', 'Bauch (cm)', 'Brust (cm)', 'Arm (cm)']];
    for (const k of keys) { const b = S.days[k].body; if (b) rows.push([deDate(k), b.weight, b.kfa, b.waist, b.chest, b.arm]); }
  }
  if (rows.length < 2) { toast('Noch keine Einträge zum Exportieren.'); return; }
  const csv = '\uFEFF' + rows.map(r => r.map(csvCell).join(';')).join('\r\n');
  try { await DL.api.save({ filename: `Bilanz-${name}-${todayKey()}.csv`, data: csv }); toast('Export gespeichert'); }
  catch (e) { if (e && e.code === 'declined') return; toast(e && e.code === 'rate_limited' ? 'Einen Moment, ein Export ist schon offen.' : 'Export hat nicht geklappt.'); }
}

  const tk = todayKey(), k = S.ui.alcDate || tk, isToday = k === tk;
  const lbl = isToday ? 'Heute' : k === addDays(tk, -1) ? 'Gestern' : longDate(k);

  const dt = drinkTotals(k), ds = getDay(k).drinks;
  const m0 = mondayOf(tk), weeks = [];
  for (let i = 11; i >= 0; i--) { const ws = addDays(m0, -7 * i); let g = 0; for (let j = 0; j < 7; j++) g += drinkTotals(addDays(ws, j)).g; weeks.push({ ws, sg: g / 10 }); }
  const mx = Math.max(lim || 0, ...weeks.map(w => w.sg), 2), BW = 340, BH = 140, L = 8, bw = (BW - L) / 12, top = 18, base = BH - 20;
  let bars = '';
  weeks.forEach((w, i) => { const h = w.sg / mx * (base - top), x = L + i * bw;
    bars += `<rect x="${(x + 3).toFixed(1)}" y="${(base - h).toFixed(1)}" width="${(bw - 6).toFixed(1)}" height="${h.toFixed(1)}" rx="3" class="bar ${i === 11 ? 'cur' : ''}"/>${w.sg ? `<text x="${(x + bw / 2).toFixed(1)}" y="${(base - h - 5).toFixed(1)}" text-anchor="middle">${fmt(w.sg, w.sg < 10 ? 1 : 0)}</text>` : ''}<text x="${(x + bw / 2).toFixed(1)}" y="${BH - 5}" text-anchor="middle">${isoWeek(w.ws)}</text>`; });
  if (lim) { const y = base - lim / mx * (base - top); bars += `<line x1="${L}" x2="${BW}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" class="lim"/>`; }
  const months = []; const nd = parseKey(tk);
  for (let i = 0; i < 6; i++) { const from = keyOf(new Date(nd.getFullYear(), nd.getMonth() - i, 1)), to0 = keyOf(new Date(nd.getFullYear(), nd.getMonth() - i + 1, 0)), to = to0 > tk ? tk : to0;
    let n = 0, g = 0, free = 0, days = 0; for (let x = from; x <= to; x = addDays(x, 1)) { const t = drinkTotals(x); n += t.n; g += t.g; if (aS && x >= aS) { days++; if (!t.g) free++; } }

  const lvl = x => { if (!aS || x < aS) return 'x'; const g = drinkTotals(x).g; if (!g) return 'f'; const sg = g / 10; return sg <= 1.5 ? 1 : sg <= 3 ? 2 : sg <= 6 ? 3 : 4; };

      ${lim ? `<div class="ah-lim"><span>${fmt(wg / 10, 1)} von ${fmt(lim)} Standardgläsern</span><span class="wbar"><i style="width:${Math.min(100, wg / 10 / lim * 100).toFixed(0)}%"></i></span></div>` : ''}</section>
    <div class="datenav"><button class="icon-btn" data-a="alc-prev" aria-label="Vorheriger Tag">‹</button><button class="datenav-l" data-a="alc-today">${lbl}</button><button class="icon-btn" data-a="alc-next" aria-label="Nächster Tag" ${isToday ? 'disabled' : ''}>›</button></div>
    <section class="panel"><div class="panel-h"><h2>Eintragen</h2><span class="small muted">${dt.all ? `${dt.n} ${dt.n === 1 ? 'Getränk' : 'Getränke'}, ${fmt(dt.kcal)} kcal` : 'Noch nichts'}</span></div>
      <div class="dgrid">${DRINKS.map(d => `<button class="dbtn" data-a="drink-add:${d.id}"><b>${esc(d.name)}</b><small>${d.abv ? `${fmt(alcG(d), 0)} g Alkohol, ` : 'ohne Alkohol, '}${d.kcal} kcal</small></button>`).join('')}</div>
      ${ds.length ? `<ul class="list" style="margin-top:12px">${ds.slice().reverse().map(d => `<li><div><b>${esc(d.name)}</b><small>${d.t ? hm(new Date(d.t)) + ', ' : ''}${fmt(alcG(d), 1)} g Alkohol</small></div><span class="kc">${fmt(d.kcal)}</span><button class="x" data-a="drink-del:${k}:${d.id}" data-confirm="Löschen?" aria-label="Löschen">×</button></li>`).join('')}</ul>` : ''}</section>

/* ---------- Training: Plan, Rekorde, Heatmap ---------- */
function vPlanDays() {
  const names = [], seen = new Set();
  for (const pl of (S.profile.plans || [])) { const n = (pl.name || '').trim(); if (n && !seen.has(nrm(n))) { seen.add(nrm(n)); names.push(n); } }

async function mEnrich(it, quiet) {
  if (!AI.sample || !it) return;

  try {
    const r = await AI.sample.json(`Gib kurze Infos zu ${it.kind === 'serie' ? 'der Serie' : 'dem Film'} "${String(it.title).replace(/"/g, "'")}". Antworte nur mit JSON:
{"title":"bekanntester Titel, deutsch falls üblich","year":2021,"genre":"ein bis zwei Genres auf Deutsch","mins":120,"seasons":null,"by":"Regie oder Serienschöpfer","desc":"ein kurzer Satz auf Deutsch ohne Spoiler"}
mins nur bei Filmen (Laufzeit in Minuten), seasons nur bei Serien. Unbekanntes als null.`, { modelTier: 'quick' });
    if (r && typeof r === 'object') { if (+r.year) it.year = +r.year; if (r.genre) it.genre = String(r.genre).slice(0, 40); if (+r.mins) it.mins = Math.round(+r.mins); if (+r.seasons) it.seasons = +r.seasons; if (r.by) it.by = String(r.by).slice(0, 60); if (r.desc) it.desc = String(r.desc).slice(0, 200); if (r.title && nrm(r.title) !== nrm(it.title) && String(r.title).length < 80) it.orig = String(r.title); touch('media'); }

  finally { delete it.busy; render(); }
}
function mAdd(title, kind, seen, r) {

  const it = { id: uid(), title: title.slice(0, 100), kind: kind === 'serie' ? 'serie' : 'film', st: seen ? 'seen' : 'want', added: Date.now() };
  if (seen) it.seen = todayKey(); if (r) it.r = r;
  S.media.items.unshift(it); touch('media'); mEnrich(it, true); return it;
}

function vMediaStats(seen, y) {

function topMeals(n = 5) {
  const cntM = new Map(), from = addDays(todayKey(), -90);
  for (const k of Object.keys(S.days)) if (k >= from) for (const m of S.days[k].meals) { const key = nrm(m.name); if (!key) continue; const c = cntM.get(key) || { n: 0, m, sl: {} }; c.n++; c.m = m; const s = slotOf(m); c.sl[s] = (c.sl[s] || 0) + 1; cntM.set(key, c); }
  const topSlot = sl => Object.entries(sl).sort((a, b) => b[1] - a[1])[0]?.[0];
  const out = [];
  for (const t of S.profile.tmpls || []) { const c = cntM.get(nrm(t.name)); out.push({ kind: 't', ref: t, name: t.name, kcal: t.kcal, p: t.p, n: (c ? c.n : 0) + 0.5, slot: t.slot || (c && topSlot(c.sl)) || null }); }
  for (const [key, c] of cntM) if (c.n >= 2 && !out.some(o => nrm(o.name) === key)) out.push({ kind: 'r', ref: c.m, name: c.m.name, kcal: c.m.kcal, p: c.m.p, n: c.n, slot: topSlot(c.sl) });
  out.sort((a, b) => b.n - a.n);
  if (out.length < n) for (const s of SUGG) { if (out.length >= n) break; if (!out.some(o => nrm(o.name) === nrm(s.name))) out.push({ kind: 'v', ref: s, name: s.name, kcal: s.kcal, p: s.p, n: 0, slot: null, sugg: true }); }
  return out.slice(0, n);
}

const fNorm = s => nrm(s).replace(/[^a-z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim();

function foodIdx(withCustom) {

}
const FQCAT = { kase: 'kaese', wurst: 'wurst', aufschnitt: 'wurst', obst: 'obst', fruchte: 'obst', frucht: 'obst', gemuse: 'gemuese', fisch: 'fisch', fleisch: 'fleisch', brot: 'brot', nusse: 'nuesse', getranke: 'getraenke', snacks: 'suess', sussigkeiten: 'suess', susses: 'suess', kuchen: 'suess', vegan: 'huelsen', fastfood: 'fastfood', fruhstuck: 'fruehstueck', saucen: 'fette', sosse: 'fette', gewurze: 'backen' };

  let s = 0;
  const w0 = e.n.split(' ')[0];
  for (let i = 0; i < toks.length; i++) {
    const t = toks[i];
    if (e.n.includes(t)) s += starts[i].test(e.n) ? 14 : 6;
    else if (e.a.includes(t)) s += starts[i].test(e.a) ? 8 : 3;
    else if (qcat && e.f.cat === qcat) s += 0;
    else return -1;
  }
  if (e.n === q) s += 120;
  else if (e.b === q) s += /^ (roh|natur|nature)$/.test(e.n.slice(e.b.length)) ? 70 : 50;
  else if (e.n.startsWith(q + ' ')) s += 50;
  else if (toks.length === 1 && w0.length > q.length && w0.endsWith(q)) s += 40;
  else if (e.n.startsWith(q)) s += 35;
  if (qcat && e.f.cat === qcat) s += 25;
  if (e.custom) s += 30;

}

  const out = [];
  for (const e of foodIdx(withCustom)) { const s = foodScore(e, q, toks, starts, qcat); if (s >= 0) out.push([s, e.f]); }

/* Für die Schnelleingabe: nur ein eindeutiger Treffer zählt */
function foodBest(text) {

  let best = null, bs = -1;

/* Händlernamen aus dem Kontoauszug lesbar machen */
const PN_MAP = [[/^REWE\b/i, 'REWE'], [/^NETTO\b/i, 'Netto'], [/^ALDI\b/i, 'Aldi'], [/^LIDL\b/i, 'Lidl'], [/^KAUFLAND/i, 'Kaufland'], [/^(EDEKA|\d*\s*E ?CENTER)/i, 'Edeka'],
  [/^AMAZON DIGITAL/i, 'Amazon Digital'], [/^AMAZON/i, 'Amazon'], [/^APPLE\.COM|^APPLE SERVICES/i, 'Apple'], [/ANTHROPIC/i, 'Anthropic (Claude)'], [/MCDONALD/i, "McDonald's"],
  [/^GA NR/i, 'Geldautomat'], [/^ABSCHLUSS$/i, 'Kontoabschluss'], [/^WERTPAPIERE$/i, 'Wertpapiere'], [/^DM[- ]DROGERIE/i, 'dm'], [/^ROSSMANN/i, 'Rossmann'], [/^SPOTIFY/i, 'Spotify'], [/^NETFLIX/i, 'Netflix'], [/^PAYPAL$/i, 'PayPal']];
const PN_LEGAL = /[,\s]+(gmbh(\s*(\+|&)?\s*co\.?\s*kg)?|ag|se(\s*(\+|&)\s*co\.?\s*kg)?|kg|e\.\s?k\.|s\.c\.a\.|s\.\s?a\.?\s*r\.\s?l\.?|limited|ltd\.?|llc|uab|inc\.?)\.?$/i;

function pnice(p) {
  const raw = String(p || '').trim(); if (!raw) return '–';

  let s = null;
  for (const [re, n] of PN_MAP) if (re.test(raw)) { s = n; break; }
  if (!s) {
    s = raw.split('/')[0].trim() || raw;
    const dup = s.match(/^(.{4,40}?)\1/); if (dup) s = dup[1];
    s = s.replace(/\s+GIR\s+\d+.*$/i, '').replace(/^\d{3,}\s+/, '').replace(/\s+sagt danke\.?.*$/i, '');
    for (let i = 0; i < 2; i++) s = s.replace(PN_LEGAL, '').trim();
    const letters = s.replace(/[^A-Za-zÄÖÜäöüß]/g, ''), up = letters.replace(/[^A-ZÄÖÜ]/g, '').length;
    if (letters.length > 4 && up / letters.length > 0.8) s = s.toLowerCase().replace(/(^|[\s\-.(&])([a-zäöü])/g, (m, a, b) => a + b.toUpperCase());
    s = s.replace(/[.,\s]+$/, '') || raw;
  }
  pnMemo.set(raw, s); return s;
}

const IS_LOCAL_APP = !!window.BILANZ_LOCAL;

const bkMB = s => (new Blob([s]).size / 1048576);
async function bkVault() {
  const out = {};
  const ref = typeof phRef === 'function' ? phRef() : null; if (!ref) return out;
  try {
    const v = await ref.get(); if (!v.exists) return out;
    out['vault'] = v.data();
    const pics = await ref.collection('pics').limit(1000).get();
    for (const d of pics.docs) {
      if (!d.exists) continue; const r = d.data(); out['vault/pics/' + d.id] = r;
      for (let j = 0; j < (r.n || 1); j++) { const c = await ref.collection('full').doc(`${d.id}_${j}`).get(); if (c.exists) out[`vault/full/${d.id}_${j}`] = c.data(); }
    }
  } catch (e) { }
  return out;
}
async function bkPrepare() {
  if (BK.busy) return;
  BK.busy = 'Backup wird erstellt …'; BK.ready = null; renderSheet();
  try {
    const docs = { profile: clone(S.profile), finance: clone(S.fin), media: clone(S.media) };
    for (const k of Object.keys(S.days)) if (!dayEmpty(S.days[k])) docs['profile/days/' + k] = clone(S.days[k]);
    if (SP.d) docs.sports = clone(SP.d);
    Object.assign(docs, await bkVault());
    const nDays = Object.keys(docs).filter(k => k.startsWith('profile/days/')).length, nPics = Object.keys(docs).filter(k => k.startsWith('vault/pics/')).length;
    const text = JSON.stringify({ app: 'bilanz', v: 1, exported_at: new Date().toISOString(), docs });
    BK.ready = { text, name: `Bilanz-Backup-${todayKey()}.json`, nDays, nPics, mb: bkMB(text) };
  } catch (e) { toast('Backup ließ sich nicht erstellen.'); }
  BK.busy = ''; renderSheet();
}

  else if (ds.medq) { const E = S.ui.med; if (E) { E.q = el.value; const q = nrm(E.q), r = $('#med-res'); if (r) r.innerHTML = (q ? foodSearch(E.q, 8, true) : []).map(f => `<button class="pk-row" data-a="med-addf:${f.key}"><span><b>${esc(f.name)}</b><small>${fmt(f.kcal)} kcal / 100 ${f.unit}${f.pn ? `, 1 ${f.pn} = ${f.pg} ${f.unit}` : ''}</small></span><span class="kc">+</span></button>`).join(''); } }

document.addEventListener('change', e => {
  const el = e.target;

  if (ch.startsWith('m-date:')) { const it = mFind(ch.slice(7)); if (it && /^\d{4}-\d{2}-\d{2}$/.test(el.value)) { it.seen = el.value; touch('media'); el.blur(); render(); } return; }
  if (ch.startsWith('c-date:') || ch.startsWith('c-time:')) { const c = (S.profile.counters || []).find(x => x.id === ch.slice(7)); if (!c) return; const d = String(c.at).slice(0, 10), t = String(c.at).slice(11, 16); const nd = ch.startsWith('c-date:') ? el.value : d, nt = ch.startsWith('c-time:') ? el.value : t; if (/^\d{4}-\d{2}-\d{2}$/.test(nd)) { c.at = nt ? `${nd}T${nt}` : nd; touch('profile'); el.blur(); render(); } return; }
  if (ch.startsWith('uf:')) { const [, id, f] = ch.split(':'), m = uMod(id); if (m) { m[f] = el.value || (f === 'exam' ? null : ''); touch('profile'); el.blur(); render(); } return; }
  if (ch === 'clock-pause') { const ck = clockRun(), v = num(el.value); el.blur(); if (ck && v != null && v >= 0 && v <= 600) { ck.pause = Math.round(v); ck.pStart = null; touch('profile'); toast(`Pause auf ${fmt(Math.round(v))} min gesetzt`); } else if (ck) toast('Gib die Pause in Minuten ein, zum Beispiel 30.'); render(); return; }
  if (ch === 'clock-start') { const v = parseHM(el.value); el.blur(); if (v) { const r = clockIn(v, null); toast(r); } render(); return; }
  if (ch.startsWith('us:')) { const f = ch.slice(3); if (/^\d{4}-\d{2}-\d{2}$/.test(el.value)) { U()[f] = el.value; touch('profile'); el.blur(); render(); } return; }
  if (ch === 'lab:m' || ch === 'lab:m2') { S.ui.lab[ch.slice(4)] = el.value; if (ch === 'lab:m') S.ui.lab.agg = 'auto'; S.ui.lab.sel = null; el.blur(); render(); return; }
  if (el.id === 'fin-input') { const files = [...(el.files || [])]; el.value = ''; if (files.length) finImport(files); return; }
  if (el.id === 'bd-input') { const f = el.files && el.files[0]; el.value = ''; if (f) bdFromPhoto(f); return; }
  if (el.dataset.change === 'prog-ex') { S.ui.progEx = el.value; el.blur(); render(); }
  else if ((el.dataset.change || '').startsWith('plan:')) { const i = el.dataset.change.slice(5); S.profile.plan = { ...(S.profile.plan || {}) }; if (el.value) S.profile.plan[i] = el.value; else delete S.profile.plan[i]; touch('profile'); toast(`${WDL[+i]}: ${el.value || 'Ruhetag'}`); }
  else if (el.dataset.bf === 'date') {
    const k = el.value, b = (S.days[k] && S.days[k].body) || {};
    S.ui.bodyForm = { date: k, weight: fmtIn(b.weight), kfa: fmtIn(b.kfa), waist: fmtIn(b.waist), chest: fmtIn(b.chest), arm: fmtIn(b.arm) };
    el.blur(); render();
  }
  else if (el.id === 'import-input') {
    const files = [...(el.files || [])]; el.value = '';
    if (files.length) importFiles(files);
  }
  else if (el.id === 'photo-input') {
    const file = el.files && el.files[0]; el.value = '';
    if (file) { S.ui.photo = file; S.ui.aiNote = 'Foto bereit. Tipp auf „Nährwerte schätzen“.'; render(); }
  }
});
document.addEventListener('keydown', e => {
