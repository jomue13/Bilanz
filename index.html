<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bilanz">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E8EDF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E151B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<script src="local.js"></script>
<title>Bilanz</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#E8EDF1; --surface:#FFFFFF; --surface2:#F0F3F6; --ink:#0F1B26; --muted:#56656F; --line:#D5DDE3;
  --accent:#2D62D3; --accent-ink:#FFFFFF;
  --energy:#E9A800; --good:#21875A; --good-soft:rgba(33,135,90,.12); --warn:#C63F2E;
  --prot:#2A5FCC; --carb:#E9A800; --fat:#AE4A8A;
  --hero-bg:#16232D; --hero-ink:#EEF2F5; --hero-muted:rgba(238,242,245,.66); --hero-track:rgba(255,255,255,.13);
  --sun:#F0A100; --moon:#C3CDD7; --cloud:#AEBCC9; --rain:#2C6BD6; --cool:#6AA7E8; --warm:#F0A100;
  --c-food:#D48F00; --c-train:#2D62D3; --c-body:#1E8A5A; --c-alc:#B3315F; --c-water:#1593C9; --c-cal:#6A55D4; --c-habit:#21875A;
  --d-train:#2B5BC6; --d-food:#9A6200; --d-alc:#A62A57; --d-body:#1B7A50; --d-water:#137FB0; --d-cal:#5B47C4; --d-habit:#1E7A4F; --d-sky:#2F6FB8; --d-sun:#A85F0E; --d-slate:#46535F;
  --font:"Archivo", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-c:"Archivo Narrow", "Arial Narrow", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E151B; --surface:#17212A; --surface2:#1F2B35; --ink:#E5ECF1; --muted:#93A1AC; --line:#2A3743;
    --accent:#76A0FF; --accent-ink:#0E151B;
    --sun:#FFC233; --moon:#AEB9C6; --cloud:#7D8E9E; --rain:#7EA9FF; --cool:#5B93D6; --warm:#FFB627;
  --c-food:#FFB627; --c-train:#76A0FF; --c-body:#46BE86; --c-alc:#F0709A; --c-water:#4CC3F0; --c-cal:#A08FFF; --c-habit:#46BE86;
    --energy:#FFC233; --good:#46BE86; --good-soft:rgba(70,190,134,.16); --warn:#FF7B67;
    --prot:#76A0FF; --carb:#FFC233; --fat:#E58CC6;
    --hero-bg:#1E2C37; --hero-ink:#EEF2F5; --hero-muted:rgba(238,242,245,.64); --hero-track:rgba(255,255,255,.1);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#17212A; --surface2:#1F2B35; --ink:#E5ECF1; --muted:#93A1AC; --line:#2A3743;
  --accent:#76A0FF; --accent-ink:#0E151B;
  --sun:#FFC233; --moon:#AEB9C6; --cloud:#7D8E9E; --rain:#7EA9FF; --cool:#5B93D6; --warm:#FFB627;
  --c-food:#FFB627; --c-train:#76A0FF; --c-body:#46BE86; --c-alc:#F0709A; --c-water:#4CC3F0; --c-cal:#A08FFF; --c-habit:#46BE86;
  --energy:#FFC233; --good:#46BE86; --good-soft:rgba(70,190,134,.16); --warn:#FF7B67;
  --prot:#76A0FF; --carb:#FFC233; --fat:#E58CC6;
  --hero-bg:#1E2C37; --hero-ink:#EEF2F5; --hero-muted:rgba(238,242,245,.64); --hero-track:rgba(255,255,255,.1);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;font:16px/1.45 var(--font);color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
p{margin:0 0 8px}
.muted{color:var(--muted)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px, calc((100% - 528px) / 2)) 10px}
.top h1{font-family:var(--font-c);font-weight:700;font-size:28px;line-height:1.1;margin:0;letter-spacing:-.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top-r{flex:none}
.icon-btn{width:44px;height:44px;flex:none;border-radius:12px;border:0;background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:24px;line-height:1;color:var(--ink)}
.icon-btn:disabled{opacity:.35}
.icon-btn[hidden]{display:none}
.top-r{display:flex;align-items:center;gap:8px}
.sync{font-size:13px;font-weight:600;line-height:1.2;padding:7px 11px;border-radius:999px;background:var(--surface);color:var(--warn);border:0;white-space:nowrap}
.sync[hidden]{display:none}
.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

main{max-width:560px;margin:0 auto;padding:2px 16px 88px}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px max(4px, calc((100% - 560px) / 2)) calc(4px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;font-size:11px;min-width:0;font-weight:500;color:var(--muted);min-height:50px}
.tabs svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink);font-weight:600}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}

/* Panels */
.panel{background:var(--surface);border-radius:18px;padding:16px;margin:0 0 12px}
.panel h2{font-family:var(--font-c);font-size:22px;text-wrap:balance;font-weight:600;line-height:1.2;margin:0 0 10px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.panel-h h2{margin:0}
.empty{padding:6px 0}

/* Hero: energy balance */
.hero{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:18px 18px 16px;margin:0 0 12px;--prot:#86A9FF;--carb:#FFC233;--fat:#EC93CB}
.hero-top{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--hero-muted)}
.hero-num{font-family:var(--font-c);font-size:20px;color:var(--hero-muted);margin-top:4px}
.hero-num b{font-size:64px;line-height:1;font-weight:700;color:var(--hero-ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-right:6px}
.meter{--gap:var(--hero-bg);position:relative;height:16px;border-radius:5px;background:var(--hero-track);overflow:hidden;margin:12px 0 8px}
.meter i{display:block;height:100%;background:var(--energy);transition:width .5s ease}
.meter.over i{background:var(--warn)}
.meter::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 3px),var(--gap) calc(10% - 3px) 10%)}
.meter.light{--gap:var(--surface);background:var(--surface2)}
.hero-left{margin:0 0 12px;font-size:15px}
.macro{margin:9px 0}
.macro-l{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.macro-l .num{color:var(--muted)}
.hero .macro-l .num{color:var(--hero-muted)}
.mbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:4px}
.hero .mbar{background:var(--hero-track)}
.mbar i{display:block;height:100%;border-radius:3px}
.mbar i.prot{background:var(--prot)} .mbar i.carb{background:var(--carb)} .mbar i.fat{background:var(--fat)}
.week{border-top:1px solid var(--hero-track);margin-top:14px;padding-top:14px}
.wbars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.wbar{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--hero-muted)}
.wcol{position:relative;width:100%;height:68px;display:flex;align-items:flex-end;justify-content:center}
.wcol i{display:block;width:72%;max-width:28px;background:var(--energy);border-radius:4px 4px 2px 2px;min-height:2px}
.wbar.over .wcol i{background:var(--warn)}
.wbar.fut .wcol i{min-height:0;height:0!important}
.wcol .gl{position:absolute;left:-4px;right:-4px;border-top:1px dashed rgba(255,255,255,.42)}
.wbar.today span{color:var(--hero-ink);font-weight:600}
.week-text{font-size:14px;margin:10px 0 0;color:var(--hero-muted)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:15px;line-height:1.15;text-align:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);border-color:transparent}
.btn.small{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.wide{width:100%}
.btn.big{width:100%;min-height:54px;font-size:17px}
.btn.danger,.link.danger{color:var(--warn)}
.btn:disabled{opacity:.55}
.armed{background:var(--warn)!important;color:#fff!important;border-color:var(--warn)!important}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px}
.link.armed{padding:4px 8px;border-radius:8px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.quick .btn{padding:0 6px;font-size:14px;min-height:50px;background:var(--surface);border-color:transparent}

/* Inputs */
input,textarea,select{width:100%;min-height:44px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:16px;outline-offset:0}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}
textarea{resize:vertical;min-height:66px;display:block}
select{width:auto;max-width:62%;padding:6px 10px;min-height:38px}
.fld{display:block;min-width:0}
.fld span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:10px 0 12px}
.grid4 input{padding:9px 6px;text-align:center}
.grid3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.addrow{display:flex;gap:8px;margin-top:12px}
.addrow input{flex:1;min-width:0}
.ai-row{display:flex;gap:8px;margin-top:8px}
.ai-row .btn{flex:1}
.ai-note{margin:8px 0 0;color:var(--muted)}
.photo-chip{margin:8px 0 0}
.import-status{margin:10px 0 0}
.import-status:empty{display:none}

/* Chips & segmented */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:7px 14px;font-size:14px;font-weight:500;min-height:38px}
.chip.on{background:var(--good);color:#fff;border-color:var(--good)}
.chip small{color:var(--muted);font-weight:400;margin-left:4px}
.seg{display:inline-grid;grid-auto-flow:column;background:var(--surface2);border-radius:10px;padding:3px;margin:10px 0 4px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14)}

/* Workout */
.aw-head{display:flex;gap:10px;align-items:center}
.aw-name{font-family:var(--font-c);font-size:20px;font-weight:600}
.aw-time{font-family:var(--font-c);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted);min-width:60px;text-align:right}
.ex{border-top:1px solid var(--line);padding:14px 0 4px;margin-top:8px}
.ex-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ex-h h3{margin:0;font-size:17px;font-weight:600}
.ex-last{font-size:13px;color:var(--muted);margin:2px 0 8px}
.set{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr) 50px;gap:8px;align-items:center;margin-bottom:6px}
.set.head{font-size:12px;color:var(--muted);margin-bottom:2px}
.set.head span{text-align:center}
.set-n{text-align:center;font-family:var(--font-c);font-weight:600;color:var(--muted)}
.set input{text-align:center;padding:8px 4px}
.tick{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-size:18px;color:var(--muted);padding:0}
.set.done .tick{background:var(--good);border-color:var(--good);color:#fff}
.set.done input{background:var(--good-soft);border-color:transparent}
.ex-actions{display:flex;gap:8px;margin:4px 0 6px}
.aw-foot{display:grid;grid-template-columns:1fr 2fr;gap:8px;margin-top:14px}
.start .chips{margin-top:8px}
.start p{margin:14px 0 0}

/* Lists */
.hist,.list,.todos{list-style:none;margin:0;padding:0}
.hist li{border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist-row{width:100%;display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:11px 0}
.hist-date{font-size:13px;color:var(--muted)}
.hist-name{font-weight:600;min-width:0}
.hist-name small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.hist-vol{font-family:var(--font-c);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.hist-vol small{display:block;font-family:var(--font);font-size:11px}
.hist-detail{padding:0 0 12px 72px;font-size:14px}
.hist-detail p{margin:4px 0}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.list li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list b{font-weight:600;display:block;overflow-wrap:anywhere}
.list small{color:var(--muted);font-size:13px}
.kc{font-family:var(--font-c);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.x{min-width:36px;height:36px;border-radius:10px;border:0;background:var(--surface2);color:var(--muted);font-size:18px;padding:0 8px}
.x.armed{font-size:13px;font-weight:600}

/* Food */
.datenav{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin:0 0 12px}
.datenav-l{border:0;background:none;font-family:var(--font-c);font-size:19px;font-weight:600;min-height:44px}
.tot-num{font-family:var(--font-c);font-size:18px;color:var(--muted)}
.tot-num b{font-size:42px;font-weight:700;line-height:1;color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.wtab{width:100%;border-collapse:collapse;font-size:15px}
.wtab td{padding:7px 0;border-top:1px solid var(--line)}
.wtab tr:first-child td{border-top:0}
.wtab td:nth-child(n+2){text-align:right;font-variant-numeric:tabular-nums}
.wtab .is-today td:first-child{font-weight:600}
.wtab .neg{color:var(--good)} .wtab .pos{color:var(--warn)}
.wtab tr.sum td{font-weight:600;border-top:2px solid var(--line)}
.recent{margin-top:16px}
.recent p{margin:0 0 8px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stats.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{min-width:0}
.stat b{display:block;font-family:var(--font-c);font-size:25px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{display:block;font-size:13px;color:var(--muted);line-height:1.3}
.big-weight{font-family:var(--font-c);font-size:18px;color:var(--muted);margin-bottom:6px}
.big-weight b{font-size:40px;font-weight:700;color:var(--ink);line-height:1;margin-right:4px;font-variant-numeric:tabular-nums}

/* Habits */
.hrow{padding:12px 0 10px;border-top:1px solid var(--line)}
.hrow:first-of-type{border-top:0}
.hrow-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hrow-h b{font-weight:600;overflow-wrap:anywhere}
.hrow-h small{font-size:13px;color:var(--muted);white-space:nowrap}
.hcells{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:8px}
.hcell{height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface2);padding:0;font-size:12px;color:var(--muted);font-weight:500}
.hcell.today{border:2px solid var(--ink);color:var(--ink);font-weight:600}
.hcell.on{background:var(--good);border-color:var(--good);color:#fff}

/* Todos */
.todos li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.todos li:first-child{border-top:0}
.todos span{overflow-wrap:anywhere}
.tbox{width:28px;height:28px;border-radius:50%;border:2px solid var(--muted);background:none;padding:0;position:relative}
.tbox.on{background:var(--good);border-color:var(--good)}
.tbox.on::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:15px;font-weight:600}
.todos.done span{text-decoration:line-through;color:var(--muted)}
.todo-more{margin-top:8px}

/* Charts */
.chart{width:100%;height:auto;display:block;margin:4px 0 6px}
.chart text{font-size:10px;fill:var(--muted);font-family:var(--font)}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-dot{fill:var(--muted);opacity:.55}
.ch-main{stroke:var(--accent);stroke-width:2.4;fill:none;stroke-linejoin:round;stroke-linecap:round}
.ch-mdot{fill:var(--accent)}

/* Sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sheet[hidden]{display:none}
.sheet-in{max-width:560px;margin:0 auto;padding:4px 16px 40px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:1}
.sheet-h h2{font-family:var(--font-c);font-size:26px;font-weight:700;margin:0}
.sheet h3{font-size:16px;font-weight:600;margin:20px 0 8px}
.sheet .panel{margin-top:0}

/* Sky hero */
.top-l{display:flex;align-items:center;gap:8px;min-width:0}
.sky{position:relative;border-radius:24px;padding:16px 16px 14px;color:#fff;background:linear-gradient(180deg,var(--sky1),var(--sky2));overflow:hidden;margin:0 0 12px;display:grid;gap:12px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
.sky button,.sky .tap{background:none;border:0;color:inherit;text-align:left;padding:0;font:inherit;text-shadow:inherit;cursor:pointer;width:100%}
.sky-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start}
.sky-date{font-weight:600;font-size:15px;display:block}
.sky-place{font-size:13px;opacity:.85;display:block;margin-top:2px}
.sky-hl{font-size:13px;opacity:.85;display:block;margin-top:8px}
.sky-temp{font-family:var(--font-c);font-size:64px;font-weight:700;line-height:.9;letter-spacing:-.02em;text-align:right;display:block;font-variant-numeric:tabular-nums}
.sky-cond{display:flex;align-items:center;gap:6px;justify-content:flex-end;font-size:14px;font-weight:500;margin-top:6px;text-align:right}
.sky-cond .wi{width:22px;height:22px;flex:none}
.sky-arc svg{display:block;width:100%;height:auto}
.sky-arc text{font:500 11px var(--font);fill:rgba(255,255,255,.85)}
.sky-times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px}
.sky-times span{opacity:.85}
.sky-times b{display:block;font-family:var(--font-c);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;opacity:1}
.sky-hours{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;text-align:center;font-size:12px}
.sky-hours .wi{width:26px;height:26px;margin:4px auto}
.sky-hours b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.sky-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;font-size:12px}
.sky-stats span{opacity:.85}
.sky-stats b{display:block;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.sky-note{font-size:12px;opacity:.8;margin:0}
.sky .wi-cloud{fill:rgba(255,255,255,.94)}.sky .wi-moon{fill:#F4F1DE}.sky .wi-drop{stroke:#D6E7FF}.sky .wi-flake{fill:#fff}.sky .wi-fog{stroke:rgba(255,255,255,.9)}
.sky-link{justify-self:end;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,.45)!important;border-radius:999px;padding:6px 12px!important;width:auto!important}
/* Weather icons */
.wi{width:24px;height:24px;display:block;overflow:visible}
.wi-sun{fill:var(--sun)}.wi-ray{stroke:var(--sun);stroke-width:1.8;stroke-linecap:round}.wi-moon{fill:var(--moon)}.wi-cloud{fill:var(--cloud)}
.wi-drop{stroke:var(--rain);stroke-width:1.8;stroke-linecap:round}.wi-flake{fill:var(--rain)}.wi-bolt{fill:var(--sun)}.wi-fog{stroke:var(--cloud);stroke-width:1.8;stroke-linecap:round}
/* Dashboard tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 12px}
.tile{background:var(--surface);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer;min-width:0}
.tile-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:2px}
.tile-l{font-size:13px;color:var(--muted);font-weight:600}
.tile-v{font-family:var(--font-c);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile-v small{font-size:15px;font-weight:500;color:var(--muted);margin-left:3px}
.tile-s{font-size:13px;color:var(--muted);line-height:1.35}
.ring{width:42px;height:42px;flex:none}.ring-bg{fill:none;stroke:var(--surface2);stroke-width:7}.ring-fg{fill:none;stroke:var(--energy);stroke-width:7;stroke-linecap:round}.ring-fg.over{stroke:var(--warn)}
.spark{width:72px;height:30px;flex:none}.spark polyline{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.spark circle{fill:var(--accent)}
.wkdots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:4px 0 12px}
.wkdot{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.wkdot i{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:block}
.wkdot.on i{background:var(--accent);border-color:var(--accent)}
.wkdot.today span{color:var(--ink);font-weight:700}
.wkdot.today i{border-color:var(--ink)}
.wkdot.on.today i{border-color:var(--accent);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.dash-train{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.dash-train p{margin:0}
/* Weather tab */
.hstrip{display:flex;gap:2px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.hstrip::-webkit-scrollbar{display:none}
.hcol{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);padding:6px 0;border-radius:12px}
.hcol.now{background:var(--surface2);color:var(--ink);font-weight:600}
.hcol .wi{width:28px;height:28px}
.hcol b{font-size:16px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.hcol .pp{color:var(--rain);font-weight:600;min-height:16px}
.hcol.ev b{font-size:13px}
.drow{width:100%;display:grid;grid-template-columns:68px 28px 38px 30px minmax(0,1fr) 30px;gap:8px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:10px 0;text-align:left;font-variant-numeric:tabular-nums}
.drow:first-child{border-top:0}
.drow .dn{font-weight:600}
.drow .pp{color:var(--rain);font-size:13px;font-weight:600}
.drow .tmin{color:var(--muted);text-align:right}
.drow .tmax{font-weight:600}
.rbar{position:relative;height:6px;border-radius:3px;background:var(--surface2)}
.rbar i{position:absolute;top:0;bottom:0;border-radius:3px;background:linear-gradient(90deg,var(--cool),var(--warm))}
.dhours{display:grid;gap:0;padding:0 0 10px}
.dh{display:grid;grid-template-columns:44px 24px 36px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:14px;padding:5px 0;font-variant-numeric:tabular-nums}
.dh .wi{width:22px;height:22px}
.dh .m{color:var(--muted);font-size:13px}
.dh .pp{color:var(--rain);font-size:13px;text-align:right;white-space:nowrap}
/* Sun page */
.sungrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.sungrid div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sungrid span{font-size:13px;color:var(--muted)}
.sungrid b{font-family:var(--font-c);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.sungrid small{font-size:13px;color:var(--muted)}
.sunnav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center}
.sunnav .datenav-l{font-size:18px}
.ychart{width:100%;height:auto;display:block}
.ychart text{font:500 10px var(--font);fill:var(--muted)}
.ychart .yl-area{fill:var(--sun);opacity:.18}.ychart .yl-line{fill:none;stroke:var(--sun);stroke-width:2}
.ychart .yl-grid{stroke:var(--line);stroke-width:1}.ychart .yl-now{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 3}
.ychart .yl-dot{fill:var(--sun);stroke:var(--surface);stroke-width:2}
.slist{display:grid}
.smonth{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:16px 0 6px;border-bottom:2px solid var(--line)}
.smonth:first-child{padding-top:0}
.smonth h3{margin:0;font-family:var(--font-c);font-size:19px;font-weight:700}
.smonth span{font-size:13px;color:var(--muted)}
.shead,.srow{display:grid;grid-template-columns:54px repeat(3,minmax(0,1fr)) 48px;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.shead{font-size:12px;color:var(--muted);padding:6px 0 2px}
.srow{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:8px 0;text-align:left;font-size:14px}
.srow .d{font-weight:600}
.srow .dl{color:var(--muted);font-size:13px;text-align:right}
.srow .ev{grid-column:1/-1;font-size:12px;font-weight:600;color:var(--accent);margin-top:-2px}
.srow.sel{background:var(--surface2)}
.srow.we .d{color:var(--muted)}

/* Schnelleingabe & Briefing */
.quick-in{display:flex;gap:8px;margin:0 0 6px}
.quick-in input{flex:1;min-width:0;background:var(--surface);border:1.5px solid var(--line);min-height:52px;border-radius:16px;padding:0 16px;font-size:16px}
.quick-in input:focus{border-color:var(--accent)}
.quick-in .btn{min-height:52px;border-radius:16px;padding:0 18px}
.quick-hint{font-size:12.5px;color:var(--muted);margin:0 4px 14px}
.brief{background:var(--surface);border-radius:18px;padding:14px 16px;margin:0 0 12px;display:grid;gap:9px}
.brief h2{font-family:var(--font-c);font-size:22px;font-weight:600;margin:0}
.brief p{margin:0;display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;align-items:baseline;font-size:15px;line-height:1.4}
.brief p i{width:9px;height:9px;border-radius:50%;display:block;transform:translateY(-1px)}
.b-cal{background:var(--c-cal)}.b-warn{background:var(--warn)}.b-train{background:var(--c-train)}.b-sky{background:var(--c-water)}.b-habit{background:var(--c-habit)}.b-sun{background:var(--sun)}
/* Tiles */
.tile{transition:transform .12s ease}
.tile:active{transform:scale(.97)}
.t-food .tile-l{color:var(--c-food)}.t-body .tile-l{color:var(--c-body)}.t-alc .tile-l{color:var(--c-alc)}.t-water .tile-l{color:var(--c-water)}
.tile-i{width:26px;height:26px;fill:none;stroke:var(--c-alc);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.plus{font-size:12px;font-weight:700;color:var(--c-water);border:1.5px solid var(--c-water);border-radius:999px;padding:3px 9px;white-space:nowrap}
.wbar{display:block;height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin:4px 0 2px}
.wbar i{display:block;height:100%;background:var(--c-water);border-radius:3px}
.wkdot i{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted);font-style:normal}
.sub-h{font-size:14px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.todos li>span{min-width:0}
.todos .tt{display:block;overflow-wrap:anywhere}
.todos small.when{display:block;font-size:13px;color:var(--c-cal);font-weight:600}
.todos small.when.late{color:var(--warn)}
.todo-form{display:grid;gap:8px;margin:0 0 10px}
.todo-when{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto;gap:8px}
.todo-when input{min-width:0;padding:9px 8px}
/* Kalender */
.cal-h{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:8px;align-items:center;margin:0 0 12px}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:12px;color:var(--muted);text-align:center;padding:2px 0 4px;font-weight:600}
.cal-c{border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 0 6px;font-variant-numeric:tabular-nums;font-weight:600;font-size:15px;color:var(--ink);min-height:48px}
.cal-c.out{color:var(--muted);opacity:.45}
.cal-c.today{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.cal-c.sel{background:var(--ink);color:var(--bg);box-shadow:none}
.cal-dots{display:flex;gap:3px;height:6px;max-width:100%;overflow:hidden}
.cal-dots i,.cal-leg i,.ag-t>i{width:6px;height:6px;border-radius:50%;display:block;flex:none}
.d-ev{background:var(--c-cal)}.d-tr{background:var(--c-train)}.d-alc{background:var(--c-alc)}.d-food{background:var(--c-food)}.d-water{background:var(--c-water)}.d-body{background:var(--c-body)}
.cal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--muted)}
.cal-leg span{display:flex;align-items:center;gap:6px}
.cal-wx{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cal-wx .wi{width:24px;height:24px}
.agenda{display:grid}
.ag{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ag:first-child{border-top:0}
.ag[role="button"]{cursor:pointer}
.ag .tm{font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;color:var(--muted)}
.ag-t{display:flex;align-items:baseline;gap:10px;min-width:0}
.ag-t>i{width:9px;height:9px;transform:translateY(-1px)}
.ag-t b{font-weight:600;display:block;overflow-wrap:anywhere}
.ag-t small{display:block;font-size:13px;color:var(--muted)}
.strike{text-decoration:line-through;color:var(--muted)}
.cal-add{margin-top:14px}
.cal-add input[type="time"]{flex:0 0 104px;padding:9px 6px}
/* Mehr */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 12px}
.mtile{border:0;border-radius:22px;padding:16px;min-height:128px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:12px;text-align:left;color:#fff;background:var(--mc);background:linear-gradient(145deg,var(--mc),color-mix(in srgb,var(--mc) 62%,#000));transition:transform .12s ease;width:100%}
.mtile:active{transform:scale(.97)}
.mtile svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mtile b{font-family:var(--font-c);font-size:22px;font-weight:700;display:block;line-height:1.1}
.mtile span span{font-size:13px;opacity:.9;display:block;margin-top:3px}
.mtile-wide{min-height:0;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px;margin-bottom:12px}
/* Essen */
.fhead{background:var(--hero-bg);color:var(--hero-ink);border-radius:22px;padding:16px;margin:0 0 12px;display:grid;grid-template-columns:116px minmax(0,1fr);gap:16px;align-items:center;--prot:#86A9FF;--carb:#FFC233;--fat:#EC93CB}
.fring{position:relative;width:116px;height:116px}
.fring svg{width:116px;height:116px;transform:rotate(-90deg);display:block}
.fring .bg{fill:none;stroke:var(--hero-track);stroke-width:11}
.fring .fg{fill:none;stroke:var(--energy);stroke-width:11;stroke-linecap:round}
.fring .fg.over{stroke:var(--warn)}
.fring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fring b{font-family:var(--font-c);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.fring span{font-size:12px;color:var(--hero-muted)}
.fh-r{min-width:0}
.fh-eaten{margin:0 0 4px;font-size:14px;color:var(--hero-muted)}
.fh-eaten b{font-family:var(--font-c);font-size:22px;color:var(--hero-ink);margin-right:4px}
.fhead .macro{margin:6px 0}.fhead .macro-l{font-size:13px}.fhead .macro-l .num{color:var(--hero-muted)}.fhead .mbar{background:var(--hero-track)}
.fweek{grid-column:1/-1;font-size:13px;color:var(--hero-muted);margin:0;border-top:1px solid var(--hero-track);padding-top:10px}
.slot-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slot-h h2{margin:0 0 2px}
.add-btn{width:44px;height:44px;border-radius:50%;border:0;background:var(--d-food);color:#fff;font-size:28px;line-height:1;display:flex;align-items:center;justify-content:center;flex:none;padding:0 0 3px;transition:transform .12s ease}
.add-btn:active{transform:scale(.92)}
.slot .list{margin-top:6px}
.slot .addrow{margin-top:8px}
.slot-q{margin-top:10px}
.chip.dashed{background:none;border-style:dashed;color:var(--muted)}
.water .panel-h{margin-bottom:8px}
.drops{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.drops i{width:18px;height:26px;display:block;border-radius:4px 4px 7px 7px;background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--line)}
.drops i.on{background:var(--c-water);box-shadow:none}
.wbtns{display:flex;flex-wrap:wrap;gap:8px}
/* Hinzufügen-Fenster */
#pick .sheet-in{padding-bottom:80px}
#pick input[type="search"]{margin:2px 0 4px}
.pk-seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;margin-bottom:10px}
.pk-seg button{padding:7px 2px;font-size:13px}
.pk-row{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;background:none;border:0;border-top:1px solid var(--line);padding:11px 0;text-align:left}
.pk-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;border-top:1px solid var(--line)}
.pk-line .pk-row{border-top:0}
#pick-body>.pk-row:first-child,#pick-body>.pk-line:first-child,.pk-sec+.pk-row,.pk-sec+.pk-line{border-top:0}
.pk-row b{font-weight:600;display:block;overflow-wrap:anywhere}
.pk-row small{color:var(--muted);font-size:13px;display:block}
.pk-sec{font-size:13px;font-weight:700;color:var(--muted);margin:16px 0 2px}
#pick .pk-name{font-family:var(--font-c);font-size:26px;font-weight:700;margin:8px 0 4px}
.pk-calc{font-size:15px;margin:10px 0 12px}
.pk-form{display:grid;gap:8px;margin-bottom:6px}
.pk-form .grid4{margin:0}
/* Alkohol */
.alc-hero{background:var(--d-alc);background:linear-gradient(150deg,var(--d-alc),color-mix(in srgb,var(--d-alc) 52%,#000));color:#fff;border-radius:22px;padding:18px;margin:0 0 12px;display:grid;gap:14px}
.ah-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.alc-hero .lbl{font-size:13px;font-weight:600;opacity:.9;display:block}
.alc-hero .big{font-family:var(--font-c);font-size:60px;font-weight:700;line-height:.95;display:block;font-variant-numeric:tabular-nums}
.alc-hero .big small{font-size:20px;font-weight:600;margin-left:6px}
.ah-streak{text-align:right;font-size:13px;opacity:.95;max-width:120px}
.ah-streak b{display:block;font-family:var(--font-c);font-size:34px;line-height:1}
.alc-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;border-top:1px solid rgba(255,255,255,.25);padding-top:12px}
.alc-stats span{opacity:.9}
.alc-stats b{display:block;font-size:22px;font-family:var(--font-c);font-weight:700;font-variant-numeric:tabular-nums}
.ah-lim{display:grid;gap:6px;font-size:13px}
.ah-lim .wbar{background:rgba(255,255,255,.22);margin:0}.ah-lim .wbar i{background:#fff}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.dbtn{border:1px solid var(--line);background:var(--surface2);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:60px;transition:transform .12s ease}
.dbtn:active{transform:scale(.96)}
.dbtn b{font-weight:600;font-size:15px}
.dbtn small{font-size:12px;color:var(--muted)}
.bars .bar{fill:var(--c-alc);opacity:.45}.bars .bar.cur{opacity:1}.bars .lim{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 4}
/* Heatmap */
.hm-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px 2px;scrollbar-width:none}
.hm-wrap::-webkit-scrollbar{display:none}
.hm{display:block}
.hm text{font:500 10px var(--font);fill:var(--muted)}
.hm .h0{fill:var(--surface2)}.hm .hx{fill:none;stroke:var(--line);stroke-width:1}
.hm .h1{fill:var(--hmc);fill-opacity:.32}.hm .h2{fill:var(--hmc);fill-opacity:.55}.hm .h3{fill:var(--hmc);fill-opacity:.8}.hm .h4{fill:var(--hmc)}
.hm .hf{fill:var(--c-habit);fill-opacity:.4}
.hm-train{--hmc:var(--c-train)}.hm-alc{--hmc:var(--c-alc)}.hm-habit{--hmc:var(--c-habit)}
.hm-leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.hm-leg .lg{width:11px;height:11px;border-radius:2.5px;display:inline-block;margin-left:8px}
.hm-leg .lg:first-child{margin-left:0}
.lg-f{background:var(--c-habit);opacity:.5}.lg-a{background:var(--c-alc)}.lg-x{box-shadow:inset 0 0 0 1px var(--line)}
/* Rekorde & Plan */
.rec{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.rec:first-of-type{border-top:0}
.rec b{display:block;font-weight:600;overflow-wrap:anywhere}
.rec small{color:var(--muted);font-size:13px}
.rec .rv{font-family:var(--font-c);font-weight:700;font-size:20px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.rec .rv small{display:block;font-family:var(--font);font-size:11px;font-weight:500}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--d-food);color:#fff;margin-left:6px;vertical-align:2px;font-family:var(--font)}
.plan{display:grid;gap:6px}
.plan label{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;align-items:center;font-size:15px}
.plan select{width:100%;max-width:none}
/* Rückblick */
.rb-seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;margin:0 0 10px}
.rb-seg button{padding:7px 2px;font-size:13px}
.rb-title{font-family:var(--font-c);font-size:28px;font-weight:700;margin:4px 2px 12px}
.rb{border-radius:22px;padding:18px;margin:0 0 12px;color:#fff;background:var(--rc);background:linear-gradient(150deg,var(--rc),color-mix(in srgb,var(--rc) 52%,#000));display:grid;gap:6px}
.rb .lbl{font-size:13px;font-weight:600;opacity:.9}
.rb .big{font-family:var(--font-c);font-size:54px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums}
.rb .big small{font-size:20px;font-weight:600;margin-left:8px}
.rb p{margin:2px 0 0;font-size:14.5px;opacity:.95;line-height:1.45}
.rb .row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.rb .row b{display:block;font-family:var(--font-c);font-size:21px;font-weight:700;overflow-wrap:anywhere;line-height:1.15}
.rb .row span{font-size:12px;opacity:.9}
/* Toast mit Aktion, Konfetti */
.toast{display:flex;align-items:center;gap:10px;width:max-content;text-align:left}
.toast.act{pointer-events:auto}
.toast-undo{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px 2px;white-space:nowrap}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:360px){
  .hero-num b{font-size:54px}
  .quick .btn{font-size:13px}
  .grid4{gap:6px}
}
/* ---------- v6: Farben ---------- */
:root{
  --d-shop:#C9561A; --d-fin:#0E7A63; --d-work:#3F48B0; --d-count:#9B3A8E; --d-steps:#0A7F90; --d-media:#6E3CC0; --d-sport:#C43D1E; --d-bday:#D0406C; --d-lab:#263B57;
  --c-shop:#D2601A; --c-fin:#0E8A6E; --c-work:#4A55C8; --c-count:#A8449B; --c-steps:#0A8EA0; --c-media:#7646C8; --c-sport:#D24A22; --c-bday:#D94A74; --c-lab:#2F5D8F;
  --t-vfb:#E32219; --t-lakers:#5B2A91; --t-fidei1:#0F8A4F; --t-fidei2:#5AAE7E;
  --area:var(--d-sky);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --c-shop:#FF9A5C; --c-fin:#3DD3A5; --c-work:#9AA3FF; --c-count:#E58AD8; --c-steps:#4FD3E4; --c-media:#B795FF; --c-sport:#FF8A63; --c-bday:#FF8AAD; --c-lab:#8FB8E8;
    --t-vfb:#FF5A4F; --t-lakers:#B58BEA; --t-fidei1:#3FC983; --t-fidei2:#8FD9AE;
  }
}
:root[data-theme="dark"]{
  --c-shop:#FF9A5C; --c-fin:#3DD3A5; --c-work:#9AA3FF; --c-count:#E58AD8; --c-steps:#4FD3E4; --c-media:#B795FF; --c-sport:#FF8A63; --c-bday:#FF8AAD; --c-lab:#8FB8E8;
  --t-vfb:#FF5A4F; --t-lakers:#B58BEA; --t-fidei1:#3FC983; --t-fidei2:#8FD9AE;
}

/* ---------- v6: lebendiger ---------- */
body{background:radial-gradient(140% 380px at 50% -90px,color-mix(in srgb,var(--area) 26%,transparent),transparent 78%) no-repeat,var(--bg)}
.top{background:color-mix(in srgb,var(--bg) 76%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px)}
.top h1{color:color-mix(in srgb,var(--area) 78%,var(--ink));transition:color .3s}
.tabs{background:color-mix(in srgb,var(--surface) 86%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(16px);backdrop-filter:saturate(1.6) blur(16px)}
.tabs button{position:relative}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:3px;left:50%;width:56px;height:32px;margin-left:-28px;border-radius:12px;background:color-mix(in srgb,var(--area) 18%,transparent);z-index:-1}
.tabs button[aria-current="page"] svg{stroke:color-mix(in srgb,var(--area) 85%,var(--ink))}
.tabs.enter button[aria-current="page"]::before{animation:pill .35s cubic-bezier(.3,1.5,.5,1)}
.tabs.enter button[aria-current="page"] svg{animation:hop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pill{from{transform:scale(.5);opacity:0}}
@keyframes hop{40%{transform:translateY(-4px)}}
.panel,.tile,.brief,.checks{box-shadow:0 1px 2px rgba(16,24,40,.04),0 8px 22px -12px rgba(16,24,40,.16)}
.btn,.chip,.ck,.x,.tbox,.icon-btn,.seg button,.dbtn,.hcell,.cal-c,.tcard,.cd{transition:transform .12s ease,background-color .2s,color .2s,border-color .2s}
.btn:active,.chip:active,.ck:active,.icon-btn:active,.seg button:active,.tcard:active,.cd:active{transform:scale(.95)}
.enter>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.enter>*:nth-child(2){animation-delay:.04s}.enter>*:nth-child(3){animation-delay:.08s}.enter>*:nth-child(4){animation-delay:.12s}.enter>*:nth-child(5){animation-delay:.16s}.enter>*:nth-child(6){animation-delay:.2s}.enter>*:nth-child(7){animation-delay:.24s}.enter>*:nth-child(n+8){animation-delay:.28s}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.enter .gb{transform-box:fill-box;transform-origin:50% 100%;animation:grow .75s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0ms) + .15s)}
@keyframes grow{from{transform:scaleY(0)}}
.enter .hb-b i,.enter .wbar i,.enter .h6-bar i,.enter .wkr .hb-b i,.enter .mbar i,.enter .meter i{transform-origin:left;animation:growx .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--d,0ms) + .15s)}
@keyframes growx{from{transform:scaleX(0)}}
.enter .fring .fg,.enter .ring-fg,.enter .donut circle{animation:ringin 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringin{from{stroke-dasharray:0 400}}
.enter .ll{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.2s .15s cubic-bezier(.4,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.just{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{40%{transform:scale(1.07)}}
.sheet:not([hidden]){animation:sheetin .32s cubic-bezier(.2,.8,.2,1)}
@keyframes sheetin{from{opacity:0;transform:translateY(28px)}}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--c-work);display:block;animation:pulse 1.4s infinite;margin-top:4px}
.t-work .tile-l{color:var(--c-work)}.t-fin .tile-l{color:var(--c-fin)}
.t-work .wbar i{background:var(--c-work)}.t-fin .wbar i{background:var(--c-fin)}
.t-work .tile-i{stroke:var(--c-work)}.t-fin .tile-i{stroke:var(--c-fin)}

/* Tägliche Checks */
.checks{background:var(--surface);border-radius:20px;padding:14px;margin:0 0 12px}
.ck-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 10px}
.ck-h h2{font-family:var(--font-c);font-size:21px;font-weight:600;margin:0}
.ck-h span{font-size:13px;color:var(--muted);font-weight:600}
.ck-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ck{display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface2);border-radius:16px;padding:10px 12px;min-height:60px;min-width:0}
.ck i{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface)}
.ck i svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck b{display:block;font-weight:600;font-size:15px;overflow-wrap:anywhere;line-height:1.2}
.ck small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.ck span{min-width:0}
.ck.on{background:linear-gradient(135deg,var(--d-habit),color-mix(in srgb,var(--d-habit) 70%,#000));border-color:transparent;color:#fff}
.ck.on i{background:#fff;border-color:#fff}.ck.on i svg{stroke:var(--d-habit);opacity:1}
.ck.on small{color:rgba(255,255,255,.88)}
.ck.just i{animation:pop .45s cubic-bezier(.3,1.8,.5,1)}

/* Helden-Karten */
.hero6{border-radius:22px;padding:18px;margin:0 0 12px;color:#fff;background:var(--hc);background:linear-gradient(150deg,var(--hc),color-mix(in srgb,var(--hc) 55%,#000));display:grid;gap:6px;position:relative;overflow:hidden}
.hero6::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.18),transparent 70%);pointer-events:none}
.hero6 .lbl{font-size:13px;font-weight:600;opacity:.9}
.hero6 .big{font-family:var(--font-c);font-size:56px;font-weight:700;line-height:.95;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hero6 .big small{font-size:19px;font-weight:600;margin-left:8px}
.hero6 p{margin:2px 0 0;font-size:14.5px;opacity:.95}
.h6-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px;margin-top:8px}
.h6-row>div>span{font-size:12px;opacity:.9;display:block}
.h6-row b{font-family:var(--font-c);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.h6-bar{height:8px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:6px}
.h6-bar i{display:block;height:100%;background:#fff;border-radius:4px}.h6-bar i.over{background:#FFB4A8}
.lab-hero p{font-size:14.5px}

/* Kennzahlen */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 10px;margin:4px 0 8px}
.kpis.k2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpis div{min-width:0}
.kpis b{display:block;font-family:var(--font-c);font-size:23px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpis>div>span{display:block;font-size:12.5px;color:var(--muted);line-height:1.3;margin-top:2px}
.kpis>div>small{display:block;font-size:11.5px;color:var(--muted)}
.seg6{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);width:100%;margin:0 0 10px}
.seg6 button{padding:7px 2px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-sec{margin-top:14px}
.grid2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Diagramme */
.bars6,.line6{width:100%;height:auto;display:block;margin:4px 0 6px;overflow:visible}
.bars6 text,.line6 text{font:500 10px var(--font);fill:var(--muted)}
.bars6 text.on{fill:var(--ink);font-weight:700}
.bars6 .bv{font-size:9.5px;font-weight:700;fill:var(--ink)}
.bars6{--bc:var(--accent)}
.gb{fill:var(--bc)}.gb.sel{fill:var(--ink)}.gb.nd{fill:none}
.c-alc{--bc:var(--c-alc)}.c-fin{--bc:var(--c-fin)}.c-work{--bc:var(--c-work)}.c-steps{--bc:var(--c-steps)}.c-media{--bc:var(--c-media)}.c-train{--bc:var(--c-train)}.c-lab{--bc:var(--c-lab)}
.hit{fill:transparent;cursor:pointer}
.gl2{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;opacity:.78}
.gl2d{fill:var(--ink);opacity:.78}
.goal{stroke:var(--ink);stroke-width:1.3;stroke-dasharray:4 4;opacity:.55}
.line6 .ll{fill:none;stroke:var(--c-lab);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.line6 .la{fill:var(--c-lab);opacity:.12}
.line6 .lg{stroke:var(--line);stroke-width:1}
.line6 .ls{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.lg-l2{display:inline-block;width:18px;height:0;border-top:2px solid var(--ink);opacity:.78;vertical-align:middle;margin-right:8px}
.lab-sel{font-size:14px;min-height:20px;margin:0 0 4px}
.lab-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.lab select{max-width:none;width:100%}
.lab-pre{margin:0 0 12px}
.hb{display:grid;gap:9px;margin:6px 0 4px}
.hb-r{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.hb-r[role="button"]{cursor:pointer}
.hb-l{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-l i{width:9px;height:9px;border-radius:50%;flex:none}
.hb-b{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;display:block}
.hb-b i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.hb-b i.over{background:var(--warn)}
.hb-r b{font-variant-numeric:tabular-nums;font-weight:600;font-size:13.5px;white-space:nowrap;text-align:right}
.donut{width:140px;height:140px;flex:none}
.donut .dn-v{font:700 17px var(--font-c);fill:var(--ink)}.donut .dn-l{font:500 11px var(--font);fill:var(--muted)}
.dn-wrap{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;align-items:center;margin-bottom:12px}
.dn-leg{display:grid;gap:4px}
.dn-li{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;background:none;border:0;padding:4px 6px;border-radius:8px;text-align:left;font-size:13px}
.dn-li.on{background:var(--surface2)}
.dn-li i{width:10px;height:10px;border-radius:3px}
.dn-li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px}
.stack i{display:block;height:100%}
.wdp{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:11px;color:var(--muted);margin:-2px 0 8px}
.wdp b{display:block;font-size:12.5px;color:var(--c-alc)}
.recs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
.recs>div>span{display:block;font-size:12.5px;color:var(--muted)}
.recs b{display:block;font-family:var(--font-c);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.recs small{display:block;font-size:12px;color:var(--muted)}
.mtab thead td{font-size:12px;color:var(--muted);font-weight:600}
.mtab td:first-child{white-space:nowrap}

/* Mehr */
.msec{font-family:var(--font-c);font-size:17px;font-weight:700;color:var(--muted);margin:16px 4px 8px;letter-spacing:.01em}
.msec:first-child{margin-top:2px}
.mgrid{gap:10px}
.mtile{min-height:108px;padding:14px;border-radius:20px;gap:10px;position:relative;overflow:hidden}
.mtile::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%)}
.mtile b{font-size:19px}
.mtile svg{width:26px;height:26px}

/* Einkauf */
.shg{padding:12px 16px}
.shg-h{font-size:13px;font-weight:700;color:var(--c-shop);margin:0 0 4px;text-transform:uppercase;letter-spacing:.04em}
.shl li{grid-template-columns:32px minmax(0,1fr) auto;padding:7px 0}
.shl li>span{font-size:16px}
.sh.done>span{text-decoration:line-through;color:var(--muted)}
.sh .tbox.on{background:var(--c-shop);border-color:var(--c-shop)}

/* Zähler */
.ccard{border-radius:24px;padding:18px;margin:0 0 12px;color:#fff;background:linear-gradient(150deg,var(--d-count),color-mix(in srgb,var(--d-count) 50%,#000));display:grid;gap:10px;position:relative;overflow:hidden}
.ccard.until{background:linear-gradient(150deg,var(--d-steps),color-mix(in srgb,var(--d-steps) 50%,#000))}
.ccard::after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 70%);pointer-events:none}
.cc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.cc-name{background:none;border:0;color:inherit;text-align:left;padding:0}
.cc-name b{display:block;font-family:var(--font-c);font-size:24px;font-weight:700}
.cc-name small{font-size:13px;opacity:.88}
.cc-pin{font-size:11px;font-weight:700;border:1px solid rgba(255,255,255,.5);border-radius:999px;padding:3px 8px;white-space:nowrap}
.cc-big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 10px}
.cc-d{font-family:var(--font-c);font-size:72px;font-weight:700;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cc-u{font-family:var(--font-c);font-size:22px;font-weight:600;opacity:.9}
.cc-hms{font-family:var(--font-c);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;opacity:.95;margin-left:auto}
.cc-ymd{margin:0;font-size:15px;font-weight:600}
.cc-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid rgba(255,255,255,.25);padding-top:10px}
.cc-wk{margin:-6px 0 0;font-size:13.5px;opacity:.9}
.cc-grid b{display:block;font-family:var(--font-c);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.cc-grid>div>span{font-size:12px;opacity:.88}
.cc-ms{display:grid;gap:4px;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.cc-ms>span{opacity:.88;font-weight:600}
.cc-ms p{margin:0;display:flex;justify-content:space-between;gap:10px;font-size:14px}
.cc-ms p span{opacity:.9;text-align:right}
.cc-st{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cc-st b{display:block;font-family:var(--font-c);font-size:19px;font-weight:700}
.cc-st>div>span{font-size:12px;opacity:.88}
.cc-again{justify-self:start;background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.45);color:#fff}
.cc-ed{background:rgba(0,0,0,.16);border-radius:14px;padding:12px;display:grid;gap:4px}
.cc-ed .fld span{color:rgba(255,255,255,.85)}
.cc-ed input{background:rgba(255,255,255,.94);color:#0F1B26;border-color:transparent}
.cc-ed .btn{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff}
.cdash{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 12px;padding:2px 16px 4px;scrollbar-width:none}
.cdash::-webkit-scrollbar{display:none}
.cd{flex:1 0 150px;max-width:240px;border:0;border-radius:18px;padding:12px 14px;color:#fff;text-align:left;background:linear-gradient(150deg,var(--d-count),color-mix(in srgb,var(--d-count) 55%,#000));display:grid;gap:2px}
.cd-n{font-size:13px;font-weight:600;opacity:.9}
.cd-v{font-family:var(--font-c);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.cd-v small{font-size:14px;font-weight:600;margin-left:6px}
.cd-s{font-family:var(--font-c);font-size:16px;font-variant-numeric:tabular-nums;opacity:.9}

/* Spielplan */
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0 0 12px}
.tcard{border:0;border-radius:18px;padding:12px 14px;text-align:left;color:#fff;display:grid;gap:4px;background:var(--tc);background:linear-gradient(150deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));min-width:0}
.tcard.on{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--tc)}
.tcard b{font-family:var(--font-c);font-size:20px;font-weight:700}
.tcard small{font-size:12px;opacity:.9}
.t-vfb{--tc:var(--t-vfb)}.t-lakers{--tc:var(--t-lakers)}.t-fidei1{--tc:var(--t-fidei1)}.t-fidei2{--tc:var(--t-fidei2)}
.tform{display:flex;gap:4px;min-height:10px}
.tform i{width:10px;height:10px;border-radius:50%;border:1.5px solid rgba(255,255,255,.7)}
.tform i.r-S{background:#7CF0A8}.tform i.r-U{background:#E8E8E8}.tform i.r-N{background:#FF8A80}
.gm{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.panel>.gm:first-of-type,.tx-day+.gm{border-top:0}

/* Arbeit */

/* Finanzen */

/* Geburtstage */

}

.d-uni,.b-uni{background:var(--c-uni)}
.us{display:grid;grid-template-columns:52px 4px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}

.phcmp-l{position:absolute;top:0;bottom:0;left:var(--x);width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 8px rgba(0,0,0,.5);pointer-events:none}
.phcmp-l b{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#222;font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.35);font-style:normal}
.phcmp-t{position:absolute;top:10px;font-size:12px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);border-radius:999px;padding:3px 9px;pointer-events:none}
.phcmp-t.l{left:10px}.phcmp-t.r{right:10px}
.phsbs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.phsbs figure{margin:0;border-radius:14px;overflow:hidden;background:#111;aspect-ratio:3/4;position:relative}
.phsbs img{width:100%;height:100%;object-fit:contain;display:block}
.phsbs figcaption{position:absolute;left:6px;right:6px;bottom:6px;font-size:11.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:8px;padding:3px 6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:6px}
.phth{position:relative;border:0;padding:0;border-radius:12px;overflow:hidden;aspect-ratio:3/4;background:var(--surface2);display:block}
.phth img{width:100%;height:100%;object-fit:cover;display:block}
.phth span{position:absolute;left:5px;bottom:5px;font-size:10.5px;font-weight:700;color:#fff;background:rgba(0,0,0,.5);border-radius:6px;padding:2px 6px}
.phv{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);animation:phfade .2s ease both}
@keyframes phfade{from{opacity:0}}
.phv-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 2px 10px}
.phv-top b{display:block;font-size:16px}
.phv-top small{font-size:13px;opacity:.8}
.phv-x{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:26px;flex:none}
.phv-img{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.phv-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.phv-img img.blur{filter:blur(8px);opacity:.7}
.phv-load{position:absolute;font-size:14px;font-weight:600;background:rgba(0,0,0,.55);border-radius:999px;padding:6px 14px}
.phv-bar{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1fr) 52px;gap:8px;padding-top:10px}
.phv-bar .btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.25);color:#fff;min-height:48px;padding:0 6px}
.phv-bar .btn:disabled{opacity:.35}
.phv-bar .btn.danger{color:#FFB4A8}
.phv-bar .btn.armed{background:#B3261E;color:#fff}

/* ---------- v9: Lebensmittel-Kategorien ---------- */
.fcats{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fcats::-webkit-scrollbar{display:none}
.fcats .chip{flex:none;white-space:nowrap}
.fcats .chip small{opacity:.65;font-weight:600;margin-left:2px;font-size:11.5px}
.fcats .chip.on small{color:inherit;opacity:.85}

/* ---------- v10: Feinschliff ---------- */
/* Eingabefelder nebeneinander immer auf einer Linie, auch bei zweizeiligen Beschriftungen */
.grid2,.grid2e,.grid4{align-items:end}
/* Ein einzelner angehefteter Zähler nimmt die ganze Breite */
.cd:only-child{max-width:none}
/* Fristen: Datum unter den Text, damit lange Titel nicht so schmal umbrechen */
.udl{grid-template-columns:32px minmax(0,1fr) auto;grid-template-areas:"i t x" "i d x";row-gap:5px}
.udl>:nth-child(1){grid-area:i}
.udl>.udl-t{grid-area:t}
.udl>.udl-d{grid-area:d;justify-self:start}
.udl>:nth-child(4){grid-area:x}
.udl>span:empty{display:none}
/* Rückblick: lange Wörter in den Kennzahlen */
.rb .row b .rbt{display:block;font-size:16px;line-height:1.2;overflow-wrap:anywhere;font-weight:700}
/* Kopfkarten: Zeile mit Aktion rechts */
.h6-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.h6-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.h6-btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.h6-sm{font-size:13px;font-weight:600;opacity:.85;font-family:var(--font)}
.hero6 .big small{white-space:normal}
/* Fotos-Bereich: Titel im Dunkelmodus heller */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--d-photo:#A8508F}}
:root[data-theme="dark"]{--d-photo:#A8508F}


/* ---------- v13: Gym-Modus (immer dunkel, Display bleibt an) ---------- */
.sheet.gym{z-index:25;background:#0B1117;color:#EEF3F6;overscroll-behavior:contain;color-scheme:dark;
  --g-card:#141E27;--g-card2:#1D2934;--g-line:#27343F;--g-mut:#93A1AC;--g-acc:#7AA4FF;--g-good:#4CC38A;--g-good-ink:#05140C}
html.gym-on,html.gym-on body{overflow:hidden}
.gy{max-width:560px;margin:0 auto;padding:4px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.gy svg{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.gy-top{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:8px}
.gy-ic{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--g-mut);font-size:11px;font-weight:600;min-height:50px;padding:4px 0}
.gy-ic svg{width:24px;height:24px;stroke-width:1.9}
.gy-ic[aria-pressed="true"]{color:#EEF3F6}
.gy-tt{text-align:center;min-width:0}
.gy-tt b{display:block;font-size:14px;font-weight:600;color:var(--g-mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gy-tt span{display:block;font:700 26px/1.1 var(--font-c);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.gy-bars{display:flex;gap:4px;margin-top:-4px}
.gy-bars button{flex:1;min-width:0;height:24px;border:0;padding:0;background:none;position:relative}
.gy-bars button::before{content:"";position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--g-line)}
.gy-bars i{position:absolute;left:0;top:9px;height:6px;border-radius:3px;background:var(--g-good)}
.gy-bars button.on::after{content:"";position:absolute;left:0;right:0;top:6px;height:12px;border-radius:6px;box-shadow:0 0 0 2px var(--g-acc)}
.gy-pos{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g-acc)}
.gy-ex h2{margin:4px 0 0;font:700 30px/1.08 var(--font-c);letter-spacing:-.005em;overflow-wrap:anywhere}
.gy-ex p{margin:6px 0 0;color:var(--g-mut);font-size:14px;line-height:1.35}
.gy-card{background:var(--g-card);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px}
.gy-card>p{margin:0}
.gy-sets{display:flex;gap:8px;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
.gy-sets::-webkit-scrollbar{display:none}
.gy-sets button{flex:0 0 auto;min-width:64px;min-height:50px;border-radius:14px;border:1px solid var(--g-line);background:none;color:#EEF3F6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 10px}
.gy-sets b{display:inline-flex;align-items:center;gap:3px;font-size:15px}
.gy-sets b svg{width:14px;height:14px;stroke-width:3}
.gy-sets small{font-size:12px;color:var(--g-mut);white-space:nowrap;font-variant-numeric:tabular-nums}
.gy-sets button.done{background:rgba(76,195,138,.16);border-color:transparent;color:#BDEBD3}
.gy-sets button.done small{color:#9FD9BC}
.gy-sets button.on{border-color:var(--g-acc);box-shadow:inset 0 0 0 1px var(--g-acc)}
.gy-sets .add{min-width:50px;font-size:24px;font-weight:400;color:var(--g-mut);border-style:dashed}
.gy-sn{font-size:15px;color:var(--g-mut)}
.gy-sn b{color:#EEF3F6;font-size:17px}
.gy-step{display:grid;grid-template-columns:64px minmax(0,1fr) 64px;align-items:center;gap:8px}
.gy-step>button{height:64px;border-radius:18px;border:0;background:var(--g-card2);color:#EEF3F6;font-size:32px;font-weight:400;line-height:1}
.gy-step>button:active{background:#2A3846}
.gy-step label{display:flex;flex-direction:column;align-items:center;min-width:0}
.gy-step input{width:100%;text-align:center;background:none;border:0;border-radius:10px;font:700 48px/1.05 var(--font-c);font-variant-numeric:tabular-nums;color:#fff;padding:0;outline:none}
.gy-step input:focus{background:var(--g-card2)}
.gy-step input::placeholder{color:#3C4B57}
.gy-step span{font-size:13px;color:var(--g-mut);font-weight:600;margin-top:-2px}
.gy-hint{font-size:12px;color:var(--g-mut);text-align:center;margin:-4px 0 0!important}
.gy-done{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:78px;border:0;border-radius:20px;background:var(--g-good);color:var(--g-good-ink);font:700 21px/1.15 var(--font);padding:0 16px;text-align:center}
.gy-done svg{width:30px;height:30px;stroke-width:2.8;flex:none}
.gy-done:active{transform:scale(.985)}
.gy-done.alt{background:var(--g-acc);color:#0B1117}
.gy-all{display:flex;align-items:center;gap:8px;font-weight:700;color:#BDEBD3}
.gy-all svg{width:22px;height:22px;stroke-width:2.6}
.gy-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gy .btn{min-height:52px;background:var(--g-card2);border-color:var(--g-line);color:#EEF3F6}
.gy .btn.primary{background:var(--g-acc);border-color:var(--g-acc);color:#0B1117}
.gy .btn.ghost{background:none}
.gy .btn.armed{background:#7A2A22;border-color:#7A2A22;color:#fff}
.gy-rest{display:flex;align-items:center;gap:14px;background:var(--g-card);border:1px solid rgba(122,164,255,.35);border-radius:22px;padding:12px 14px}
.gy-ring{position:relative;width:112px;height:112px;flex:none}
.gy-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.gy-ring circle{fill:none;stroke-width:9}
.gy-ring .tr{stroke:var(--g-line)}
.gy-ring .pr{stroke:var(--g-acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.gy-ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:700 32px/1 var(--font-c);font-variant-numeric:tabular-nums}
.gy-rest-i{flex:1;min-width:0}
.gy-rest-i small{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--g-acc)}
.gy-rest-i p{margin:3px 0 0;font-size:14px;line-height:1.35;color:#C9D3DB}
.gy-rest-b{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:6px;margin-top:10px}
.gy-rest-b button{min-height:44px;border-radius:12px;border:0;background:var(--g-card2);color:#EEF3F6;font-weight:700;font-size:15px}
.gy-rest.done{border-color:transparent;background:rgba(76,195,138,.18);animation:gyFlash .9s ease-out 2}
.gy-rest.done b{font-size:18px}
.gy-rd{width:44px;height:44px;border-radius:50%;background:var(--g-good);color:var(--g-good-ink);display:flex;align-items:center;justify-content:center;flex:none}
.gy-rd svg{width:26px;height:26px;stroke-width:2.8}
.gy-x{align-self:flex-start;background:none;border:0;color:var(--g-mut);font-size:24px;line-height:1;min-width:36px;min-height:36px}
@keyframes gyFlash{0%{background:rgba(76,195,138,.55)}100%{background:rgba(76,195,138,.18)}}
.gy-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gy-nav button{min-height:58px;border-radius:16px;border:1px solid var(--g-line);background:none;color:#EEF3F6;font-weight:600;font-size:14px;padding:6px 12px;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.gy-nav button+button{text-align:right}
.gy-nav small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--g-mut)}
.gy-nav button:disabled{opacity:.35}
.gy-fin{color:var(--g-mut)!important}
.gy-lock{margin:0;text-align:center;font-size:12px;color:var(--g-mut)}
.gy-lock:empty{display:none}
.gy-open svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.aw-head+.gy-open{margin:10px 0 12px}
/* Wochenvarianten */
.wv-seg button{font-variant-numeric:tabular-nums}
.wv{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.wv li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.wv li.next{box-shadow:inset 0 0 0 2px var(--area,var(--accent))}
.wv-n{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--surface);color:var(--muted)}
.wv li.done .wv-n{background:var(--good);color:#fff}
.wv-n svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wv-t b{display:block}
.wv-t small{display:block;color:var(--muted);font-size:13px;line-height:1.35}
.wv li.done .wv-t b{color:var(--muted)}

/* ---------- v14: Coach, Aufwärmen, Tauschen im Gym-Modus ---------- */
.gy-exh{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gy-swapb{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--g-line);background:none;color:#C9D3DB;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;min-height:32px}
.gy-swapb svg{width:16px;height:16px;stroke-width:2}
.gy-swapb[aria-expanded="true"]{border-color:var(--g-acc);color:var(--g-acc)}
.gy-coach{border-radius:18px;padding:11px 13px;background:rgba(122,164,255,.1);border:1px solid rgba(122,164,255,.25)}
.gy-coach.up{background:rgba(76,195,138,.12);border-color:rgba(76,195,138,.35)}
.gy-coach.down{background:rgba(255,183,77,.1);border-color:rgba(255,183,77,.3)}
.gy-coach-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.gy-cb{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--g-acc)}
.gy-coach.up .gy-cb{color:var(--g-good)}.gy-coach.down .gy-cb{color:#FFB74D}
.gy-coach-h b{font:700 18px/1.1 var(--font-c);font-variant-numeric:tabular-nums}
.gy-rb{margin-left:auto;background:none;border:0;color:var(--g-mut);font-size:13px;font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:30px}
.gy-coach p{margin:5px 0 0;font-size:13.5px;line-height:1.35;color:#C9D3DB}
.gy-rng{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap;font-size:13px;color:var(--g-mut)}
.gy-rng button{width:36px;height:36px;border-radius:10px;border:0;background:var(--g-card2);color:#EEF3F6;font-size:20px}
.gy-rng b{min-width:22px;text-align:center;color:#EEF3F6;font-size:17px;font-variant-numeric:tabular-nums}
.gy-sets button.warm{border-style:dashed}
.gy-sets button.warm b{color:#FFB74D}
.gy-sets button.warm.done{background:rgba(255,183,77,.12);color:#FFD9A0}
.gy-warmb{width:100%;min-height:44px;border-radius:14px;border:1px dashed rgba(255,183,77,.55);background:rgba(255,183,77,.08);color:#FFD9A0;font-weight:600;font-size:14px;padding:6px 12px}
.gy-done.warm{background:#FFB74D;color:#2A1A00}
.gy-wt{align-self:center;background:none;border:0;color:var(--g-mut);font-size:13px;text-decoration:underline;text-underline-offset:3px;min-height:32px}
.gy-alt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;border:1px solid var(--g-line);background:var(--g-card2);color:#EEF3F6;border-radius:14px;padding:10px 12px}
.gy-alt small{color:var(--g-mut);font-size:12.5px}
.gy-swapin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.gy-swapin input{min-height:48px;border-radius:12px;border:1px solid var(--g-line);background:var(--g-card2);color:#EEF3F6;padding:0 12px;font-size:16px}
/* Coach in der Listenansicht */
.ex-coach{margin:4px 0 8px;font-size:13px;line-height:1.35;color:var(--muted)}
.ex-coach b{color:var(--ink);margin-right:4px}
.ex-coach.up b{color:var(--good)}
/* ---------- v14: Muskelkarte ---------- */
.mus .panel-h{flex-wrap:wrap;gap:8px}
.mseg button{font-size:13px;padding:0 10px}
.mm{display:block;width:100%;max-width:400px;margin:8px auto 4px;height:auto;--mm0:color-mix(in srgb,var(--muted) 16%,var(--surface2))}
.mm .b{fill:var(--surface2);stroke:var(--line);stroke-width:1}
.mm .m{stroke:var(--surface);stroke-width:1.2;cursor:pointer;transition:fill .25s}
.mm .l0{fill:var(--mm0)}
.mm .l1{fill:color-mix(in srgb,var(--c-train) 28%,var(--mm0))}
.mm .l2{fill:color-mix(in srgb,var(--c-train) 52%,var(--mm0))}
.mm .l3{fill:color-mix(in srgb,var(--c-train) 82%,var(--mm0))}
.mm .l4{fill:var(--c-train)}
.mm .sel{stroke:var(--ink);stroke-width:2}
.mm .ln{fill:none;stroke:var(--surface);stroke-width:1;opacity:.7;pointer-events:none}
.mm .mt{font-size:10px;fill:var(--muted);text-anchor:middle;font-weight:600}
.mdet{margin:4px 0 10px;font-size:14px}
.mrows{display:flex;flex-direction:column;gap:2px}
.mrow{display:grid;grid-template-columns:104px minmax(0,1fr) 62px;align-items:center;gap:10px;background:none;border:0;padding:5px 2px;border-radius:10px;text-align:left;color:inherit}
.mrow.sel{background:var(--surface2)}
.mrow-l{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow-b{position:relative;height:10px;border-radius:5px;background:var(--surface2);overflow:visible}
.mrow-b .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 18%,transparent);border-radius:5px}
.mrow-b .v{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--c-train)}
.mrow-b .v.l1,.mrow-b .v.l2{background:color-mix(in srgb,var(--c-train) 55%,var(--surface2))}
.mrow-b .p{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:var(--ink);border-radius:1px;opacity:.7}
.mrow-n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.mrow-n small{font-weight:500;color:var(--muted)}

/* ---------- v14: Zahlencode für Fotos ---------- */
.phl2{border-radius:26px;margin:0 0 12px;padding:26px 16px 22px;color:#fff;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  background:linear-gradient(165deg,color-mix(in srgb,var(--hc) 88%,#fff 6%),color-mix(in srgb,var(--hc) 45%,#05070A));min-height:min(640px,calc(100dvh - 190px));justify-content:center}
.pin{display:flex;flex-direction:column;align-items:center;width:100%;max-width:320px}
.pin-t{margin:10px 0 14px;font-size:20px;font-weight:600;letter-spacing:.01em}
.pin-dots{display:flex;gap:18px;justify-content:center;height:16px}
.pin-dots i{width:14px;height:14px;border-radius:50%;border:1.6px solid currentColor;transition:background .12s,transform .12s}
.pin-dots i.on{background:currentColor;transform:scale(1.06)}
.pin.busy .pin-dots i{animation:pinPulse .9s ease-in-out infinite}
.pin.busy .pin-dots i:nth-child(2){animation-delay:.12s}.pin.busy .pin-dots i:nth-child(3){animation-delay:.24s}.pin.busy .pin-dots i:nth-child(4){animation-delay:.36s}.pin.busy .pin-dots i:nth-child(5){animation-delay:.48s}.pin.busy .pin-dots i:nth-child(6){animation-delay:.6s}
.pin.shake .pin-dots{animation:pinShake .48s cubic-bezier(.36,.07,.19,.97)}
.pin-m{min-height:20px;margin:12px 0 10px;font-size:14px;opacity:.9}
.pin-pad{display:grid;grid-template-columns:repeat(3,76px);gap:16px 26px;justify-content:center}
.pin-pad>span{width:76px;height:76px}
.pin-k{width:76px;height:76px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:inherit;font:400 32px/1 var(--font);display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,transform .08s}
.pin-k:active{background:rgba(255,255,255,.42);transform:scale(.95)}
.pin-k:disabled{opacity:.4}
.pin-k.fn{background:none}
.pin-k.fn svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linejoin:round;stroke-linecap:round}
.pin-k.txt{font-size:15px;font-weight:600}
.phl2 .phl-i{margin-bottom:2px}
.pin-link{color:#fff!important;opacity:.9;margin-top:12px;text-decoration:underline;text-underline-offset:3px}
.pin-note{font-size:13px;opacity:.85;max-width:300px;margin:12px 0 0}
.pin-reset{background:rgba(0,0,0,.25);border-radius:16px;padding:12px;margin-top:12px;text-align:left;max-width:340px}
.phconv .pin{color:var(--ink);margin:6px auto 0}
.phconv .pin-k{background:var(--surface2);-webkit-backdrop-filter:none;backdrop-filter:none}
.phconv .pin-k:active{background:var(--line)}
.phconv .pin-k.fn{background:none}
.phconv .pin-link{color:var(--accent)!important}
@keyframes pinShake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(5px)}30%,50%,70%{transform:translateX(-10px)}40%,60%{transform:translateX(10px)}}
@keyframes pinPulse{0%,100%{opacity:.35}50%{opacity:1}}
